<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>한문 요괴 원정기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Nanum+Brush+Script&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
/* Layout: 16:9 달리기 무대(캔버스) 위 HUD, 넓은 화면은 오른쪽 패널을 무대 위에 겹치고 좁은 화면은 아래로 쌓는다. 먹빛 바탕 + 단청 띠 하나. */
:root{
  --ink:#15141b; --ink-2:#1f1e28; --ink-3:#2a2935; --line:#3b3949;
  --text:#f1ebdc; --muted:#aaa4b6; --paper:#f3ead6;
  --verm:#e0533a; --jade:#3aa893; --gold:#e9b949; --blue:#6d8fc4; --plum:#b9548a;
  --display:"Nanum Brush Script","Gowun Batang",serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --han:"Noto Serif KR","Batang","AppleMyungjo",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;
  display:flex;justify-content:center;box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
kbd{font-family:var(--body);font-size:.78em;padding:1px 6px;border-radius:5px;border:1px solid var(--line);background:var(--ink);color:var(--muted)}

.game{width:100%;max-width:calc((100dvh - 110px) * 1.7778);min-width:0;container-type:inline-size;display:flex;flex-direction:column;gap:10px}
@media (max-width:760px){.game{max-width:none}}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 14px;background:var(--ink-2);border-radius:12px;position:relative;overflow:hidden}
.hud::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:repeating-linear-gradient(90deg,var(--jade) 0 22px,var(--verm) 22px 30px,var(--gold) 30px 36px,var(--blue) 36px 52px,var(--verm) 52px 58px)}
.hp{display:flex;align-items:center;gap:8px;flex:1 1 220px;min-width:0}
.lbl{font-weight:700;color:var(--muted);letter-spacing:.08em;font-size:12px}
.bar{flex:1;height:16px;background:var(--ink);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:100%;background:var(--jade);border-radius:999px;transition:width .35s ease,background-color .3s}
.bar i.mid{background:var(--gold)} .bar i.low{background:var(--verm);animation:pulse .8s infinite alternate}
@keyframes pulse{to{opacity:.55}}
#hpTxt{font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.mid{flex:1 1 180px;display:flex;flex-direction:column;gap:4px;min-width:0}
#stName{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:6px;background:var(--ink);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}
.right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.score{display:flex;align-items:baseline;gap:6px}
.score small{color:var(--muted);font-size:12px}
.score b{font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums;min-width:3ch;display:inline-block}
#combo{font-size:13px;color:var(--verm);min-width:4.5em}
.inv{font-family:var(--han);font-weight:700;display:flex;align-items:center;gap:3px;padding:2px 8px;border-radius:7px;background:var(--ink-3)}
.inv b{font-family:var(--body);font-size:13px;font-variant-numeric:tabular-nums}
.inv.on{box-shadow:inset 0 0 0 1px var(--gold)}
#mute,#fsBtn{background:var(--ink-3);border:0;border-radius:7px;width:32px;height:28px}
:fullscreen body,body:-webkit-full-screen{padding-block:8px}
#mute[aria-pressed="true"]{color:var(--muted);text-decoration:line-through}

/* 무대 */
.arena{position:relative}
.arena.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-9px,4px)}30%{transform:translate(8px,-5px)}45%{transform:translate(-6px,3px)}60%{transform:translate(5px,-2px)}80%{transform:translate(-2px,1px)}}
@media (prefers-reduced-motion:reduce){.arena.shake{animation:none}}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:var(--ink-3);touch-action:manipulation}
canvas{display:block;width:100%;height:100%}

/* 패널 */
.panel{margin-top:10px;background:rgba(21,20,27,.94);border:1px solid var(--line);border-radius:14px;padding:18px;overflow:auto;scrollbar-width:thin}
@container (min-width:760px){
  .panel{position:absolute;margin:0;top:12px;right:12px;bottom:12px;width:min(52%,540px);backdrop-filter:blur(6px)}
}
.eyebrow{margin:0;font-size:12px;letter-spacing:.12em;color:var(--gold)}
.panel h1{font-family:var(--display);font-weight:400;font-size:62px;line-height:1;margin:4px 0 8px;text-wrap:balance}
.panel h2{font-size:13px;letter-spacing:.1em;color:var(--muted);margin:18px 0 8px;font-weight:700}
.lede{margin:0 0 14px;max-width:60ch}
.go{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:10px;padding:12px 20px;background:var(--verm);color:#fff;font-size:17px;font-weight:700;box-shadow:0 4px 0 #8f2c1c;transition:transform .08s}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #8f2c1c}
.go kbd{background:rgba(0,0,0,.2);border-color:rgba(255,255,255,.3);color:#fff}
.ghost{border:1px solid var(--line);background:transparent;border-radius:10px;padding:11px 16px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.best{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--ink-3);border-radius:999px;padding:5px 12px;font-size:13px}
.chip small{color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:#08221d}
.chip[aria-pressed="true"] small{color:#0d3a31}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:400}
.lvl{display:inline-block;padding:1px 9px;border-radius:6px;font-size:12px;font-weight:700;color:#fff}
.l1{background:var(--blue)}.l2{background:var(--jade)}.l3{background:var(--plum)}.l4{background:var(--verm)}
.items{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.items li{display:flex;gap:10px;align-items:center;font-size:13px;min-width:0}
.items .ic{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--han);font-weight:700;color:#fff;border:2px solid var(--paper)}
.keys{font-size:13px;color:var(--muted);margin:0}
.keys kbd{margin:0 2px}
/* 상단 상태창 크게 (2배) */
.hud{padding:16px 22px;gap:14px 26px;border-radius:16px}
.hud::before{height:6px}
.hp{gap:12px;flex-basis:300px}
.lbl{font-size:18px}
.bar{height:32px}
#hpTxt{font-size:23px;font-weight:700;min-width:96px}
.mid{gap:8px}
#stName{font-size:18px}
.prog{height:12px}
.right{gap:16px}
.score small{font-size:16px}
.score b{font-size:36px}
#combo{font-size:18px}
.inv{font-size:25px;padding:4px 12px;border-radius:10px;gap:6px}
.inv b{font-size:20px}
#mute,#fsBtn{width:56px;height:52px;border-radius:10px;font-size:22px}
@container (max-width:760px){.hud{padding:10px 14px;gap:8px 14px}.lbl{font-size:14px}.bar{height:20px}#hpTxt{font-size:18px;min-width:70px}#stName{font-size:15px}.score b{font-size:28px}.inv{font-size:20px}.inv b{font-size:16px}#mute,#fsBtn{width:40px;height:36px;font-size:18px}}
/* 문제 글자 25% 크게 */
.qtext{font-size:21px}
.han{font-size:55px}
.han.long{font-size:35px}
.opts .opt{font-size:19px;padding:12px 14px}
.quiz .qmeta{font-size:20px;gap:10px}
.quiz .lvl{font-size:20px;padding:2px 12px}
.quiz .cat{padding:1px 10px}
.quiz .timer{margin:16px 0 6px}
.quiz .timer b{font-size:19px;top:12px}
.quiz .qtext{font-size:24px;margin-top:22px}
.quiz .boss-line{font-size:17.5px}
.quiz .tools,.quiz .hintbtn{font-size:16px}
.quiz .v{font-size:25px}
.quiz .ans,.quiz .exp{font-size:18.5px}
@container (min-width:760px){.panel{width:min(56%,640px)}}

/* 문제 */
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.cat{color:var(--paper);border:1px solid var(--line);padding:0 8px;border-radius:6px}
.cat .ctype{color:#c792f2;font-weight:700}
.lvl{font-family:var(--han),var(--body)}
.dmg{margin-left:auto;color:var(--verm)}
.pips{color:var(--verm);letter-spacing:2px}
.timer{position:relative;height:8px;margin:12px 0 4px;background:var(--ink-3);border-radius:9px}
.timer i{position:absolute;inset:0;background:var(--gold);border-radius:9px;transform-origin:left;transition:background-color .2s}
.timer i.warn{background:var(--verm)}
.timer b{position:absolute;right:0;top:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.boss-line{margin:14px 0 0;color:var(--gold);font-size:14px;display:flex;gap:10px;align-items:center}
.boss-line img{width:48px;height:48px;border-radius:10px;object-fit:cover;object-position:50% 15%;flex:none;border:1px solid var(--line)}
.qtext{font-size:17px;margin:14px 0 6px;text-wrap:pretty}
.han{font-family:var(--han);font-weight:700;font-size:44px;line-height:1.35;letter-spacing:.08em;text-align:center;padding:10px 6px;margin:6px 0 12px;background:var(--paper);color:#1b1a22;border-radius:10px;white-space:pre-line;overflow-wrap:anywhere}
.han.long{font-size:28px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--ink-3);transition:transform .1s,border-color .1s,opacity .2s}
.opt span{min-width:0}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateX(3px)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--jade);background:rgba(58,168,147,.22)}
.opt.no{border-color:var(--verm);background:rgba(224,83,58,.22)}
.opt.gone{opacity:.25;text-decoration:line-through}
.opt:disabled:not(.ok):not(.no){opacity:.5}
.opt span{font-family:var(--body)}
.nextrow{display:flex;justify-content:flex-end}
.opt .ohj{font-size:1.2em;line-height:1}
.tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px;font-size:13px}
.hintbtn{border:1px dashed var(--blue);background:transparent;border-radius:8px;padding:6px 10px;font-size:13px}
.hintbtn:disabled{opacity:.4;cursor:default}
.hintbtn em{font-style:normal;color:var(--gold)}
.shield-note{color:var(--gold)}
.fb{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.v{font-size:20px;display:inline-block}
.v.ok{color:var(--jade)}.v.no{color:var(--verm)}
.fb .combo{color:var(--gold);font-size:14px;margin-left:6px}
.ans{margin:6px 0 0}
.ans b{font-family:var(--han),var(--body)}
.exp{color:var(--muted);margin:6px 0 14px;max-width:62ch}

/* 결과 */
.result .head{display:flex;gap:16px;align-items:center}
.seal{flex:none;width:84px;height:84px;border:4px solid var(--verm);border-radius:8px;color:var(--verm);font-family:var(--han);font-weight:700;font-size:30px;line-height:1;display:grid;place-items:center;transform:rotate(-6deg);writing-mode:vertical-rl;letter-spacing:.05em}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0}
.stats div{background:var(--ink-3);border-radius:10px;padding:10px}
.stats dt{font-size:12px;color:var(--muted)}
.stats dd{margin:0;font-size:22px;font-variant-numeric:tabular-nums}
@container (max-width:420px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.panel h1{font-size:52px}}
.notes{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.notes li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;background:var(--ink-3);border-radius:10px;padding:12px}
.notes .nh{font-family:var(--han);font-weight:700;font-size:20px;color:var(--paper);max-width:9em;white-space:pre-line}
.notes p{margin:0}
.notes .nq{font-size:13px;color:var(--muted)}
.notes .na{font-family:var(--han),var(--body);color:var(--jade);margin-top:2px}
.notes .ne{font-size:13px;margin-top:4px}
.empty{color:var(--muted);font-size:14px}
/* 이야기 */
.story{display:flex;flex-direction:column;gap:12px}
.story .who{display:flex;gap:12px;align-items:center}
.story .face{width:84px;height:84px;border-radius:12px;object-fit:cover;object-position:50% 12%;border:2px solid var(--gold);flex:none}
.story .badge{width:84px;height:84px;border-radius:12px;display:grid;place-items:center;font-family:var(--han);font-size:30px;font-weight:700;color:#fff;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.story .nm{font-size:24px;font-weight:700;line-height:1.3}
.story .nm small{display:block;font-size:17px;color:var(--muted);font-weight:400;margin-top:2px}
.story .line{font-size:17px;line-height:1.75;margin:0;min-height:5.2em;padding:14px 16px;background:var(--ink-3);border-radius:12px;animation:lineIn .35s ease}
.story .line.nar{background:transparent;border:1px dashed var(--line);color:var(--paper);font-family:var(--han)}
.story .line .hj{font-family:var(--han);color:var(--gold)}
@keyframes lineIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.story .line{animation:none}}
.story .row{justify-content:space-between}
.story .skip{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline}
.story .sprog{font-size:12px;color:var(--muted)}
.choice{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--ink-3);transition:border-color .12s,transform .12s}
.choice:hover{border-color:var(--gold);transform:translateX(3px)}
.choice b{font-size:15px}
.choice b kbd{margin-right:6px}
.fxs{display:flex;flex-wrap:wrap;gap:4px}
.fx{display:inline-block;font-size:12px;padding:1px 8px;border-radius:6px}
.fx.good{background:rgba(58,168,147,.22);color:#86e3cc}.fx.bad{background:rgba(224,83,58,.22);color:#ffa18e}.fx.risk{background:rgba(233,185,73,.18);color:var(--gold)}
/* 이야기 창: 넉넉한 크기와 큰 글자 */
.story{gap:18px}
.story .line{font-size:22px;line-height:1.8;padding:20px 22px;min-height:4.6em}
.story .skip{font-size:16px}
.story .sprog{font-size:15px}
.story .choice{gap:10px;padding:18px 22px;border-radius:14px}
.story .choice b{font-size:22px;line-height:1.4}
.story .choice b kbd{font-size:.8em;margin-right:10px}
.story .fxs{gap:8px}
.story .fx{font-size:16px;padding:4px 12px;border-radius:8px}
.story .qtext{font-size:24px}
.story .exp{font-size:18.5px}
@container (min-width:760px){.panel:has(.story){width:min(64%,760px);padding:24px}}
.journey{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.journey li{background:var(--ink-3);border-radius:8px;padding:8px 10px}
.send{display:flex;flex-wrap:wrap;gap:8px}
.send input{flex:1 1 120px;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--ink-3);color:var(--text);font:inherit}
.send input:focus{outline:2px solid var(--gold)}

/* 캐릭터 고르기 */
.chars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.char{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;align-content:start;text-align:left;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--ink-3);transition:transform .12s,border-color .12s}
.char:hover{transform:translateY(-2px);border-color:var(--muted)}
.char[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:#2d2a27}
.pv-wrap{position:relative;display:block;aspect-ratio:4/5;border-radius:8px;overflow:hidden;background:var(--ink)}
.pv-wrap img{width:100%;height:100%;object-fit:cover;object-position:50% 10%;display:block}
.pv-wrap canvas{position:absolute;right:0;bottom:0;width:48%;height:auto;aspect-ratio:1}
.char .info{min-width:0;display:flex;flex-direction:column;gap:3px}
.char b{font-size:15px}
.role{font-size:11px;letter-spacing:.06em;color:var(--gold)}
.char[aria-pressed="true"] .role::after{content:" · 선택됨"}
.stat{display:grid;grid-template-columns:2.4em minmax(0,1fr);align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.stat span{height:5px;background:var(--ink);border-radius:9px;overflow:hidden}
.stat i{display:block;height:100%;border-radius:9px}
.abil{margin:2px 0 0;padding-left:14px;font-size:11.5px;line-height:1.45}
@container (max-width:520px){.chars{grid-template-columns:1fr}.char{grid-template-columns:104px minmax(0,1fr);column-gap:10px;align-items:center}}

.pad{display:none;position:absolute;left:2%;right:2%;bottom:3%;justify-content:space-between;gap:10px;pointer-events:none;z-index:2}
.pad .grp{display:flex;gap:2.2cqw}
.pad button{pointer-events:auto;width:13cqw;min-width:86px;aspect-ratio:1.35;border-radius:18px;border:2px solid rgba(255,255,255,.35);background:rgba(20,18,30,.42);color:#fff;font-size:clamp(15px,2cqw,24px);font-weight:700;backdrop-filter:blur(3px);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.pad .mv{background:rgba(70,40,90,.5)}
.pad button:active{background:rgba(233,185,73,.55);transform:scale(.95)}
.touch .pad,.pad.show{display:flex}
.arena.panel-on .pad{display:none}
</style>
</head>
<body>

<div class="game">
  <header class="hud">
    <div class="hp"><span class="lbl">HP</span><div class="bar"><i id="hpFill"></i></div><b id="hpTxt">100/100</b></div>
    <div class="mid"><span id="stName">출발 전</span><div class="prog"><i id="prog"></i></div></div>
    <div class="right">
      <span class="score"><small>점수</small><b id="score">0</b></span>
      <span id="combo"></span>
      <span class="inv" id="invB" title="부적: 오답 피해 1회 막기">符<b>0</b></span>
      <span class="inv" id="invP" title="붓: 보기 2개 지우기">筆<b>0</b></span>
      <button id="fsBtn" aria-label="전체 화면" title="전체 화면" hidden>⛶</button>
      <button id="mute" aria-pressed="false" aria-label="소리 끄기">♪</button>
    </div>
  </header>
  <div class="arena" id="arena">
    <div class="stage" id="stage"><canvas id="cv" aria-label="달리기 무대"></canvas>
      <div class="pad"><span class="grp"><button id="jumpBtn">점프 ▲</button><button id="slideBtn">숙이기 ▼</button></span><span class="grp"><button class="mv" id="leftBtn" hidden>◀ 왼쪽</button><button class="mv" id="rightBtn" hidden>오른쪽 ▶</button></span></div></div>
    <section class="panel" id="panel" aria-live="polite"></section>
  </div>
</div>

<script>
/* ───────── 교과서 단원별 문제 ─────────

 ['3','한자어휘',1,'다음 한자어의 독음은?','春夏秋冬',['춘하추동','춘하추투','하춘추동','춘추하동'],'봄 춘 · 여름 하 · 가을 추 · 겨울 동. 네 계절이 나란한 병렬 관계이다.'],
 ['3','한자',1,'다음 한자의 훈과 음은?','冬',['겨울 동','가을 추','여름 하','얼음 빙'],'冬至(동지), 冬眠(동면)의 ‘겨울 동’이다.'],
 ['3','한자',1,'다음 한자의 훈과 음은?','秋',['가을 추','벼 화','겨울 동','불 화'],'禾(벼)와 火(불)가 들어 있다. 곡식이 익는 계절 ‘가을 추’이다.'],
 ['3','한자',2,'다음 한자의 훈과 음은?','少',['적을 소','작을 소','많을 다','클 대'],'少는 ‘적을 소’로 多(많을 다)와 반대된다. ‘작을 소’는 小이다.'],
 ['3','한자',1,'다음 한자의 훈과 음은?','深',['깊을 심','찾을 탐','마음 심','물 수'],'氵(물)가 뜻을 나타낸다. 深夜(심야), 深海(심해)에 쓰인다.'],
 ['3','한자어휘',3,'단어의 짜임이 나머지 셋과 다른 것은?','',['休日','年少','夜深','人造'],'休日은 ‘쉬는 날’로 수식 관계이다. 年少 · 夜深 · 人造는 ‘○○이 ○○하다’의 주술 관계이다.'],
 ['3','한자어휘',1,'다음 한자어의 뜻은?','長短',['길고 짧음','긴 시간','짧은 길','오래 삶'],'長(길 장)과 短(짧을 단)이 반대되는 병렬 관계이다. 장점과 단점을 뜻하기도 한다.'],

 /* 4과 */
 ['4','한자어휘',1,'서술어와 목적어로 이루어진 짜임으로, ‘○○을 ○○하다’로 풀이되는 것은?','',['술목 관계','술보 관계','주술 관계','수식 관계'],'서술어가 앞에, 목적어가 뒤에 온다. 우리말로 풀 때는 뒤를 먼저 읽는다.'],
 ['4','한자어휘',1,'서술어와 보어로 이루어진 짜임으로, ‘○○에 ○○하다’로 풀이되는 것은?','',['술보 관계','술목 관계','주술 관계','병렬 관계'],'보어는 서술어의 뜻을 채워 준다. 入學(학교에 들어가다), 歸家(집으로 돌아가다).'],
 ['4','한자어휘',1,'다음 한자어의 독음은?','讀書',['독서','독자','속서','서독'],'讀(읽을 독) + 書(글 · 책 서). 책을 읽다.'],
 ['4','한자어휘',1,'다음 한자어의 짜임은?','讀書',['술목 관계','술보 관계','수식 관계','주술 관계'],'‘책을 읽다’, 서술어(讀) + 목적어(書)이다.'],
 ['4','한자어휘',2,'다음 한자어의 뜻은?','開會',['회의를 열다','모임이 열리다','열린 모임','회사를 열다'],'開(열 개)가 서술어, 會(모일 회)가 목적어인 술목 관계이다.'],
 ['4','한자어휘',3,'授業(수업)의 授가 뜻하는 것은?','授業',['주다','받다','손','묻다'],'授(줄 수)는 가르침을 ‘주는’ 쪽이다. 가르침을 ‘받는’ 것은 受(받을 수)를 쓴 受業이다.'],
 ['4','한자어휘',2,'다음 한자어의 짜임은?','入學',['술보 관계','술목 관계','주술 관계','병렬 관계'],'‘학교에 들어가다’로 풀이된다. ‘~에’가 붙는 보어이므로 술보 관계이다.'],
 ['4','한자어휘',1,'다음 한자어의 뜻은?','出席',['자리에 나아가다','자리를 떠나다','자리를 비우다','먼저 나서다'],'出(날 출) + 席(자리 석). 모임이나 수업 자리에 나오는 것이다.'],
 ['4','한자어휘',1,'다음 한자어의 뜻은?','下校',['수업을 마치고 학교에서 돌아감','학교의 아래쪽','학교에 가다','낮은 학교'],'下(아래 · 내릴 하) + 校(학교 교). 학교에서 내려간다, 곧 집에 돌아간다는 뜻이다.'],
 ['4','한자어휘',2,'다음 한자어의 짜임은?','歸家',['술보 관계','술목 관계','수식 관계','주술 관계'],'‘집으로 돌아가다’, 서술어(歸) + 보어(家)이다.'],
 ['4','한자어휘',2,'다음 한자어의 짜임은?','卒業',['술목 관계','술보 관계','주술 관계','병렬 관계'],'‘학업을 마치다’, 서술어(卒) + 목적어(業)이다.'],
 ['4','한자어휘',3,'다음 한자어의 짜임은?','沈水',['술보 관계','술목 관계','수식 관계','주술 관계'],'‘물에 잠기다’로 풀이된다. ‘~을’이 아니라 ‘~에’이므로 술보 관계이다.'],
 ['4','한자어휘',3,'다음 중 술목 관계가 아닌 것은?','',['入學','讀書','開會','授業'],'入學은 ‘학교에 들어가다’로 술보 관계이다. 나머지는 ‘~을 ~하다’ 술목 관계이다.'],
 ['4','한자성어',1,'다음 성어의 뜻은?','多情多感',['정이 많고 감정이 풍부함','많은 사람을 사랑함','일이 많아 바쁨','감정을 숨김'],'多(많을 다) · 情(뜻 정) · 感(느낄 감). 정도 많고 느낌도 많다.'],
 ['4','한자',1,'다음 한자의 훈과 음은?','席',['자리 석','베 포','저녁 석','집 실'],'出席(출석), 座席(좌석)의 ‘자리 석’이다. ‘저녁 석’은 夕이다.'],
 ['4','한자',2,'다음 한자의 훈과 음은?','感',['느낄 감','달 감','감히 감','마음 심'],'咸(다 함)이 소리, 心(마음)이 뜻을 맡는다. 感動(감동)에 쓰인다.'],
 ['4','한자',1,'다음 한자의 훈과 음은?','會',['모일 회','합할 합','고을 읍','일찍 증'],'會議(회의), 社會(사회)의 ‘모일 회’이다.'],

 /* 5과 */
 ['5','기타',1,'옛이야기를 바탕으로 만들어진 성어를 무엇이라 하는가?','',['고사성어','사자성어','속담','격언'],'고사(故事)는 옛날에 있었던 일이다. 네 글자로 된 성어는 사자성어라고 한다.'],
 ['5','한자성어',1,'다음 성어의 뜻은?','一石二鳥',['한 가지 일로 두 가지 이익을 얻음','돌 하나로 새를 기름','두 사람이 함께 일함','한 번에 실패함'],'돌 하나[一石]로 새 두 마리[二鳥]를 잡는다. 꿩 먹고 알 먹고와 통한다.'],
 ['5','한자성어',1,'다음 성어의 독음은?','一石二鳥',['일석이조','일석이오','일석삼조','일석이도'],'鳥는 ‘새 조’. 烏(까마귀 오)와 모양이 비슷하니 주의하자.'],
 ['5','한자성어',1,'다음 성어의 뜻은?','十中八九',['거의 대부분, 예외가 거의 없음','열 가운데 하나도 맞지 않음','여덟과 아홉의 차이','열 가지 중 여덟을 버림'],'열 가운데 여덟이나 아홉, 곧 거의 다라는 뜻이다.'],
 ['5','한자성어',1,'다음 성어의 뜻은?','聞一知十',['하나를 들으면 열을 알 만큼 총명함','한 번 듣고 열 번 말함','열 번 들어도 모름','하나만 알면 그만둠'],'聞(들을 문) · 知(알 지). 공자의 제자 안회의 총명함을 두고 한 말이다.'],
 ['5','한자성어',2,'빈칸에 들어갈 한자는?','聞一知□',['十','百','千','一'],'하나를 들으면 열[十]을 안다. 聞一知十(문일지십).'],
 ['5','한자성어',1,'다음 성어의 뜻은?','千辛萬苦',['온갖 어려운 고비를 겪으며 고생함','천 가지 맛을 봄','만 년 동안 삶','매운 음식을 좋아함'],'천 가지 매운 것[辛]과 만 가지 쓴 것[苦]. 갖은 고생을 말한다.'],
 ['5','한자성어',1,'다음 성어의 뜻은?','九牛一毛',['많은 것 가운데 아주 적은 부분','아홉 마리 소가 털 하나를 다툼','소를 정성껏 기름','털이 많은 소'],'아홉 마리 소의 털 가운데 한 가닥. 아주 하찮은 양을 말한다.'],
 ['5','한자성어',1,'다음 성어의 뜻은?','百發百中',['무슨 일이나 틀림없이 잘 들어맞음','백 번 쏘면 한 번 맞음','백 명이 함께 쏨','가운데로 백 걸음 감'],'백 번 쏘아[發] 백 번 맞힌다[中]. 계획이나 예상이 다 맞을 때도 쓴다.'],
 ['5','한자성어',2,'‘여러 번 실패해도 포기하지 않고 계속 노력함’을 뜻하는 성어는?','',['七顚八起','九死一生','百發百中','一石二鳥'],'일곱 번 넘어져도[顚] 여덟 번 일어난다[起]. 七顚八起(칠전팔기).'],
 ['5','한자성어',2,'다음 성어의 뜻은?','九死一生',['죽을 고비를 여러 번 넘기고 겨우 살아남','아홉 명 중 한 명만 태어남','오래오래 삶','한 번 살면 아홉 번 죽음'],'아홉 번 죽을 뻔하다 한 번 살아난다. 매우 위험한 고비를 넘긴 경우이다.'],
 ['5','한자',1,'‘알 지’에 해당하는 한자는?','',['知','之','智','止'],'知는 ‘알 지’. 之(갈 지), 智(슬기 지), 止(그칠 지)는 음만 같다.'],
 ['5','한자',2,'다음 한자의 훈과 음은?','發',['필 발','쏠 사','뽑을 발','오를 등'],'發은 ‘필 · 쏠 발’. 百發百中에서는 화살을 쏜다는 뜻이다.'],
 ['5','기타',2,'億은 얼마를 나타내는가?','億',['10⁸ (1억)','10⁴ (1만)','10¹² (1조)','10¹⁶ (1경)'],'萬(만, 10⁴) → 億(억, 10⁸) → 兆(조, 10¹²) → 京(경, 10¹⁶) 순으로 커진다.'],
 ['5','한자',1,'숫자 7을 나타내는 한자는?','',['七','八','九','十'],'六(육) 七(칠) 八(팔) 九(구) 十(십).'],
 ['5','한자성어',2,'다음 성어의 뜻은?','轉禍爲福',['재앙이 바뀌어 오히려 복이 됨','복이 바뀌어 화가 됨','화를 내면 복이 달아남','복을 남과 나눔'],'禍(재앙 화)를 굴려[轉] 福(복)으로 만든다[爲]. 노력으로 나쁜 일을 좋게 바꿀 수 있다는 뜻이다.'],
 ['5','고사성어',2,'다음 성어의 뜻은?','塞翁之馬',['인생의 좋고 나쁜 일은 미리 알 수 없음','말을 잘 타는 노인','변방을 지키는 용사','늙은 말이 길을 앎'],'변방 노인[塞翁]의 말이 달아났다 돌아오고, 아들이 다쳤다가 전쟁을 피한 이야기에서 나왔다.'],

 /* 6과 */
 ['6','기타',1,'예로부터 민간에 전해 오며 삶의 지혜와 교훈이 담긴 말은?','',['속담','법률','상소문','한시'],'俗談(풍속 속 · 말씀 담). 6과 성어는 이런 속담을 네 글자로 줄인 것이다.'],
 ['6','한자성어',1,'吾鼻三尺과 뜻이 통하는 속담은?','吾鼻三尺',['내 코가 석 자','소 귀에 경 읽기','등잔 밑이 어둡다','까마귀 날자 배 떨어진다'],'吾(나 오) 鼻(코 비) 三尺(석 자). 내 코가 석 자나 늘어져 남을 돌볼 겨를이 없다.'],
 ['6','한자성어',2,'다음 성어의 뜻은?','吾鼻三尺',['내 사정이 급해 남을 돌볼 겨를이 없음','코가 아주 길다','세 사람이 나를 도움','내 말이 옳다'],'자기 일이 다급해 남을 도울 여유가 없다는 뜻이다.'],
 ['6','한자',2,'1인칭(나)을 나타내는 이 한자의 훈과 음은?','吾',['나 오','다섯 오','깨달을 오','낮 오'],'吾는 ‘나 오’. 我(나 아), 余(나 여)도 1인칭으로 쓰인다.'],
 ['6','한자성어',1,'다음 성어의 뜻은?','苦盡甘來',['고생 끝에 즐거움이 옴','단 것을 먹으면 쓴 것이 옴','고생이 끝없이 이어짐','달콤한 말에 속음'],'쓴 것[苦]이 다하면[盡] 단 것[甘]이 온다[來]. 고생 끝에 낙이 온다.'],
 ['6','한자성어',1,'燈下不明과 뜻이 통하는 속담은?','燈下不明',['등잔 밑이 어둡다','내 코가 석 자','소 귀에 경 읽기','낫 놓고 기역자도 모른다'],'등불 아래가 밝지 않다. 가까이 있는 것을 오히려 잘 모른다는 뜻이다.'],
 ['6','한자성어',1,'다음 성어의 독음은?','燈下不明',['등하불명','등하부명','증하불명','등상불명'],'不은 뒤 글자가 ㄷ · ㅈ으로 시작하면 ‘부’, 그 밖에는 ‘불’로 읽는다. 明 앞이므로 ‘불’.'],
 ['6','한자성어',1,'다음 성어의 뜻은?','牛耳讀經',['아무리 가르쳐도 알아듣지 못함','소가 글을 잘 읽음','귀를 기울여 들음','경전을 소리 내어 읽음'],'소[牛] 귀[耳]에 경[經] 읽기[讀]. 아무리 말해도 소용없다는 뜻이다.'],
 ['6','한자성어',1,'目不識丁과 뜻이 통하는 속담은?','目不識丁',['낫 놓고 기역자도 모른다','등잔 밑이 어둡다','까마귀 날자 배 떨어진다','고생 끝에 낙이 온다'],'눈으로 보고도 丁(고무래)을 알아보지 못한다. 글자를 전혀 모를 만큼 무식하다는 뜻이다.'],
 ['6','한자성어',3,'目不識丁에서 丁이 가리키는 물건은?','目不識丁',['고무래','못','낫','장정'],'丁은 곡식을 긁어모으는 농기구 고무래 모양이다. 이 쉬운 글자조차 모른다는 뜻이다.'],
 ['6','한자성어',1,'다음 성어의 뜻은?','烏飛梨落',['관계없는 일이 공교롭게 겹쳐 의심을 받음','까마귀가 배를 좋아함','열심히 하면 열매를 얻음','새가 멀리 날아감'],'까마귀[烏] 날자[飛] 배[梨] 떨어진다[落]. 억울한 오해를 받는 상황이다.'],
 ['6','한자성어',1,'一石二鳥와 뜻이 통하는 속담은?','一石二鳥',['꿩 먹고 알 먹고','소 귀에 경 읽기','내 코가 석 자','등잔 밑이 어둡다'],'한 가지 일로 두 가지 이득을 본다. ‘도랑 치고 가재 잡고’도 같은 뜻이다.'],

 /* 7과 */
 ['7','고사성어',1,'다음 성어의 뜻은?','白眉',['여럿 가운데 가장 뛰어난 사람이나 물건','늙어서 눈썹이 하얗게 셈','눈썹을 하얗게 칠함','나이 든 스승'],'촉나라 마씨 다섯 형제 중 눈썹에 흰 털이 있던 마량이 가장 뛰어났다는 이야기에서 나왔다.'],
 ['7','고사성어',1,'다음 말의 뜻은?','千里眼',['사물을 꿰뚫어 보는 뛰어난 관찰력','천 리를 걷는 튼튼한 다리','먼 마을의 이름','아주 큰 눈'],'천 리 밖까지 보는 눈. 멀리 일어난 일까지 훤히 아는 능력을 말한다.'],
 ['7','고사성어',1,'다음 성어의 뜻은?','朝三暮四',['간사한 꾀로 남을 속임','아침저녁으로 부지런함','하루 일곱 끼를 먹음','세 번 생각하고 네 번 말함'],'원숭이에게 도토리를 아침에 셋, 저녁에 넷 준다니 화내고, 아침에 넷 저녁에 셋이라니 좋아했다는 이야기이다.'],
 ['7','고사성어',1,'다음 성어의 독음은?','朝三暮四',['조삼모사','조삼막사','조삼모서','조사모삼'],'朝(아침 조) · 暮(저물 모). 暮를 莫(없을 막)으로 잘못 읽지 말자.'],
 ['7','고사성어',1,'다음 성어의 뜻은?','結草報恩',['죽어서라도 은혜를 잊지 않고 갚음','풀을 베어 집을 지음','은혜를 원수로 갚음','풀로 매듭을 지어 놂'],'풀[草]을 묶어[結] 은혜[恩]를 갚는다[報]. 죽은 이의 혼이 풀을 엮어 적을 넘어뜨렸다는 이야기에서 나왔다.'],
 ['7','고사성어',1,'다음 성어의 뜻은?','多多益善',['많으면 많을수록 더욱 좋음','많이 가지면 오히려 손해','착한 일을 많이 함','이익을 고루 나눔'],'한나라 장수 한신이 자신은 군사가 많을수록 잘 다룬다고 한 말에서 나왔다.'],

 ['7','고사성어',1,'다음 성어의 뜻은?','漁父之利',['둘이 다투는 사이 엉뚱한 사람이 이득을 봄','어부가 고기를 많이 잡음','아버지가 남긴 재산','물고기를 나눠 가짐'],'도요새와 조개가 다투다 둘 다 어부에게 잡혔다는 이야기에서 나왔다.'],
 ['7','고사성어',1,'다음 성어의 뜻은?','狐假虎威',['남의 권세를 빌려 위세를 부림','여우가 호랑이를 이김','호랑이가 여우를 도움','거짓말로 벌을 피함'],'여우[狐]가 호랑이[虎]의 위엄[威]을 빌린다[假]. 뒤따르는 호랑이를 보고 짐승들이 달아났다.'],
 ['7','고사성어',1,'다음 성어의 뜻은?','五十步百步',['조금 차이는 있어도 본질은 같음','오십 걸음이 백 걸음보다 훨씬 나음','천천히 걸어야 멀리 감','백 걸음 앞서 나감'],'전쟁터에서 오십 걸음 도망친 병사가 백 걸음 도망친 병사를 비웃었다는 맹자의 이야기이다.'],

 ['7','고사성어',2,'‘반 친구 중 노래 실력이 단연 최고’인 사람을 가리키는 말은?','',['白眉','漁父之利','朝三暮四','五十步百步'],'白眉는 여럿 가운데 가장 뛰어난 사람을 뜻한다.'],

 ['8','한자성어',1,'다음 성어의 뜻은?','言行一致',['말과 행동이 하나로 들어맞음','말이 많으면 행동이 없음','한마디 말에 이름','행동이 말보다 앞섬'],'言(말씀 언) · 行(다닐 · 행할 행) · 致(이를 치). 말한 대로 실천한다.'],
 ['8','한자성어',1,'다음 성어의 뜻은?','言中有骨',['예사로운 말 속에 깊은 속뜻이 있음','말하다 뼈를 다침','말에 힘이 없음','뼈 있는 음식을 먹음'],'말[言] 속[中]에 뼈[骨]가 있다[有]. 가볍게 들리지만 숨은 뜻이 있는 말이다.'],
 ['8','문장풀이',2,'이 문장과 뜻이 통하는 속담은?','來語不美 去語何美',['가는 말이 고와야 오는 말이 곱다','말 한마디로 천 냥 빚을 갚는다','낮말은 새가 듣고 밤말은 쥐가 듣는다','발 없는 말이 천 리 간다'],'오고 가는 말은 서로 닮는다. 내가 먼저 고운 말을 써야 한다는 교훈이다.'],
 ['8','문장풀이',3,'다음 문장의 풀이로 알맞은 것은?','來語不美 去語何美',['오는 말이 아름답지 않은데 가는 말이 어찌 아름답겠는가?','가는 말이 아름다우면 오는 말도 아름답다','오는 말과 가는 말이 모두 아름답다','아름다운 말은 오지도 가지도 않는다'],'來(올 래) 語(말씀 어) 不美(아름답지 않다), 去(갈 거) 語 何美(어찌 아름답겠는가).'],
 ['8','문장풀이',2,'去語何美에서 何의 뜻은?','何',['어찌','무엇','누구','언제'],'何는 ‘어찌 ~하겠는가?’로 풀어 반어의 뜻을 나타낸다.'],
 ['8','문장풀이',3,'다음 문장의 풀이로 알맞은 것은?','忠言逆於耳 而利於行',['충고하는 말은 귀에 거슬리나 행동에는 이롭다','충성스러운 말은 귀에 즐겁고 행동에는 해롭다','귀에 거슬리는 말은 하지 말라','충성은 행동으로 보여야 한다'],'忠言(충고의 말) 逆(거스르다) 於耳(귀에), 而(그러나) 利(이롭다) 於行(행동에).'],
 ['8','문장풀이',2,'忠言逆於耳에서 於의 뜻은?','於',['~에 (대상)','~보다 (비교)','~와 함께','~ 때문에'],'於耳는 ‘귀에’. 於는 앞말이 미치는 장소 · 대상을 나타낸다.'],
 ['8','문장풀이',3,'忠言逆於耳 而利於行에서 而가 앞뒤를 잇는 관계는?','而',['그러나 (역접)','그리고 (순접)','만약 (가정)','왜냐하면 (원인)'],'귀에 거슬린다 ↔ 행동에 이롭다. 반대되는 내용을 이으므로 역접이다. 토 ‘~나’가 힌트.'],
 ['8','문장풀이',2,'다음 문장의 풀이로 알맞은 것은?','無道人之短',['다른 사람의 단점을 말하지 말라','다른 사람의 길은 짧다','사람의 도리는 없다','남의 장점을 말하라'],'無(~하지 말라) 道(말하다) 人之短(남의 짧은 점). 여기서 道는 ‘길’이 아니라 ‘말하다’이다.'],

 ['8','한자',2,'다음 한자의 훈과 음은?','己',['몸 기','이미 이','뱀 사','자기 자'],'己(몸 기)는 ‘자기’라는 뜻으로 쓰인다. 已(이미 이), 巳(뱀 사)와 모양이 비슷하다.'],

 ['8','문장풀이',2,'聽之以耳에서 以의 뜻은?','以',['~로써 (수단)','~ 때문에','~와 함께','~보다'],'以耳는 ‘귀로써’. 以는 수단 · 방법을 나타낸다.'],
 ['8','기타',2,'한문 구절 끝에 우리말 조사나 어미를 붙여 읽는 것을 무엇이라 하는가?','',['현토','번역','음독','압운'],'붙이는 우리말을 토(吐)라 하고, 토를 다는 것을 현토(懸吐)라 한다. 예: 忠言은 逆於耳나.'],

 ['13','기타',2,'기승전결 중 轉의 역할은?','轉',['시상을 바꾸거나 비약시킴','시상을 불러일으킴','시상을 이어 펼침','시상을 모아 마무리함'],'轉(구를 전). 앞의 흐름을 틀어 새로운 장면이나 감정으로 넘어간다.'],
 ['13','기타',2,'先景後情의 뜻으로 알맞은 것은?','先景後情',['먼저 경치를 그리고 뒤에 감정을 드러냄','먼저 감정을 쓰고 뒤에 경치를 그림','경치만 그림','감정만 드러냄'],'先(먼저) 景(경치) 後(뒤) 情(정). 한시에서 자주 쓰는 표현 방법이다.'],

 ['13','기타',2,'칠언시는 한 구를 어떻게 띄어 읽는가?','',['네 자 / 세 자','세 자 / 네 자','두 자 / 다섯 자','다섯 자 / 두 자'],'○○○○/○○○. 오언시는 두 자 / 세 자이다.'],

 ['14','기타',1,'「靜夜思」의 주제는?','靜夜思',['고향을 그리워하는 나그네의 마음','님과의 이별','숨어 사는 사람에 대한 동경','자연의 아름다움 예찬'],'고요한 밤 달빛을 보다 고개 숙여 고향을 생각한다.'],
 ['14','문장풀이',2,'다음 구절의 풀이는?','牀前看月光',['침상 앞에 비친 달빛을 보고','침상 앞에서 달을 노래하고','달빛 아래 침상을 놓고','앞산 위로 달이 뜨고'],'牀(침상 상) 前(앞 전) 看(볼 간) 月光(달빛).'],
 ['14','문장풀이',2,'다음 구절의 풀이는?','疑是地上霜',['이것이 땅 위의 서리인가 의심하였네','땅 위에 서리가 내렸네','서리가 녹아 땅이 젖었네','땅 위의 눈을 밟았네'],'疑(의심할 의) 是(이것) 地上霜(땅 위의 서리). 하얀 달빛을 서리로 착각했다.'],
 ['14','문장풀이',2,'다음 구절의 풀이는?','擧頭望山月',['고개 들어 산의 달을 바라보다가','머리를 들고 산에 올라','산 위로 달이 떠오르니','달을 보며 고개를 숙여'],'擧(들 거) 頭(머리 두) 望(바라볼 망) 山月(산의 달).'],

const URLSET=(()=>{
 let p;try{p=new URLSearchParams(location.search)}catch(e){p=new URLSearchParams('')}
 const ids=UNITS.map(u=>u[0]);
 const u=(p.get('u')||'').split(',').filter(x=>ids.includes(x));
 const c=(p.get('c')||'').split(',').filter(x=>x!==''&&CATS[+x]).map(x=>CATS[+x]);
 /* 시험용: ?stage=3 이면 이야기를 건너뛰고 3장부터 시작한다 */
 const st=Math.max(1,Math.min(5,parseInt(p.get('stage'),10)||1));
 /* 시험용: ?boss=4 면 4장 보스전만 바로 한다 */
 const bs=parseInt(p.get('boss'),10);const boss=bs>=1&&bs<=5?bs-1:-1;
 /* 시험용: ?perks=1 이면 검토 중인 캐릭터 능력(술사 회복 · 궁수 회피 · 검객 불굴)을 켠다 */
 return {u,c,lock:p.get('lock')==='1'&&(u.length>0||c.length>0),stage:boss>=0?boss:st-1,boss,perks:p.get('perks')==='1'};
})();

function placeObs(t,xm){const O=OBS[t],mul=O.air&&O.vx?.85+rand()*.6:1,v=Math.abs(O.vx||0)*mul,run=280+([0,0,10,22,35][G.stage]||0);

function planGap(S,i,x0,combos=0){
 const D=DIFF[i],n=D.n[0]+Math.floor(rand()*(D.n[1]-D.n[0]+1)),itemAt=Math.floor(n/2);
 let x=x0+(D.pre??560),prevAir=null;
 const comboAt=new Set();{const idx=[...Array(n-1)].map((_,j)=>j+1);while(comboAt.size<Math.min(combos,idx.length))comboAt.add(idx.splice(Math.floor(rand()*idx.length),1)[0])}
 for(let k=0;k<n;k++){
  if(comboAt.has(k)){x+=placeCombo(i,x)+D.sp+rand()*50;prevAir=null;continue}
  let t=pickObsType(S);
  if(k===0&&OBS[t].vx)t=S.obs.find(o=>!OBS[o].vx)||'rock';
  const air=!!OBS[t].air;if(prevAir!==null&&prevAir!==air)x+=60;
  if(!air&&COMBO_OK.includes(t)&&(D.combos!=null?comboAt.has(k):rand()<D.combo)){
   const three=i>=3&&rand()<.3,pool=three?TRIPLE_OK:COMBO_OK,cnt=three?3:2,gapc=three?52:70;
   for(let j=0;j<cnt;j++){const tj=j===0&&pool.includes(t)?t:pool[Math.floor(rand()*pool.length)];placeObs(tj,x+j*gapc)}
   x+=gapc*(cnt-1)+40;
  }else if(t==='spikefloor'){
   const cnt=i>=3&&rand()<.45?3:2,ph=rand();

  if(!air&&!OBS[t].vx&&t!=='spikefloor'&&MIX[i]&&rand()<MIX[i].p){
   const m=MIX[i].set[Math.floor(rand()*MIX[i].set.length)];
   if(m==='scale'){const e=addObs('scale',x);e.trig=(HAZ[4].scale[0]+HAZ[4].scale[1])/2}

/* 연속 장애물(3~5장): 위+아래 · 위+앞 · 앞+아래를 이어서 낸다. 돌려주는 값은 더 쓴 거리

function placeCombo(i,x){
 const S=STAGES[i],ground=S.obs.filter(t=>!OBS[t].air&&!OBS[t].vx&&!OBS[t].dyn),g=()=>ground.length?ground[Math.floor(rand()*ground.length)]:'rock';
 const front=i===2?'ghostfly':i===3?'lavaball':'fireball',kind=['ud','uf','fd'][Math.floor(rand()*3)];
 const top=xx=>{if(i===4){const e=addObs('scale',xx);e.trig=(HAZ[4].scale[0]+HAZ[4].scale[1])/2}else{const e=addObs(i===3?'lavadrop':'fallrock',xx);e.trig=Math.max(e.trig,300)}};
 if(kind==='ud'){addObs(g(),x);top(i===4?x:x+240);return i===4?40:280}
 if(kind==='uf'){top(x);placeObs(front,x+(i===4?60:300));return 320}
 placeObs(front,x);addObs(g(),x+180);return 220;
}
function addObs(type,x,phase){const O=OBS[type],H=HAZ[G.stage]||HAZ[4],e={kind:'obs',type,x,vx:O.vx||0,rot:0,seed:rand()*9};

 if(!S.obsW)return S.obs[Math.floor(rand()*S.obs.length)];

}

const BGM={title:['title',.55],stage0:['stage1',.5],stage1:['stage2',.5],stage2:['stage3',.5],stage3:['stage4',.5],stage4:['stage5',.5],boss:['boss',.55],end:['ending',.55]};
const bgmCh={};let bgmKey=null;
function bgmWant(){
 const st=G.state;
 if(st==='title')return'title';
 if(st==='over')return null;
 if(G.won||st==='win')return'end';
 if(st==='story')return'title';
 if(st==='dodge'||(G.cur&&G.cur.e&&G.cur.e.boss))return'boss';
 if(G.ents.some(e=>e.kind==='enemy'&&e.boss&&!e.done&&e.x-G.cam<W+40))return'boss';
 return'stage'+G.stage;
}
function bgmCh_(k){
 if(bgmCh[k])return bgmCh[k];
 const a=new Audio(`assets/bgm/${BGM[k][0]}.mp3`);a.loop=true;a.preload='auto';a.crossOrigin='anonymous';
 const ch={a,g:null};
 try{const src=AC.createMediaElementSource(a);ch.g=AC.createGain();ch.g.gain.value=0;src.connect(ch.g).connect(AC.destination)}catch(e){ch.g=null;a.volume=0}
 return bgmCh[k]=ch;
}
function bgmFade(ch,to,sec){
 if(ch.g){const t=AC.currentTime;ch.g.gain.cancelScheduledValues(t);ch.g.gain.setValueAtTime(ch.g.gain.value,t);ch.g.gain.linearRampToValueAtTime(to,t+sec)}
 else ch.a.volume=Math.max(0,Math.min(1,to));
}
function bgmUpdate(force){
 if(!AC)return;
 const want=muted?null:bgmWant();
 if(want===bgmKey&&!force)return;
 if(want===bgmKey&&want&&bgmCh[want]&&!bgmCh[want].a.paused)return;
 const old=bgmKey&&bgmCh[bgmKey];bgmKey=want;
 if(old){const oa=old.a;bgmFade(old,0,1);setTimeout(()=>{if(bgmCh[bgmKey]!==old)oa.pause()},1100)}
 if(!want)return;
 const ch=bgmCh_(want);
 if(want!=='title'&&ch.a.paused)ch.a.currentTime=0; /* 첫 화면 · 이야기 곡은 이어서, 나머지는 처음부터 */
 const p=ch.a.play();if(p&&p.catch)p.catch(()=>{});
 bgmFade(ch,BGM[want][1],1);
}
/* 효과음 파일: Endless Sky의 퍼블릭 도메인 효과음(CREDITS.md 참고). 불러오지 못하면 아래 합성음으로 대신한다 */
const SFX_FILES={ok:['strike',.7],defeat:['explode-small',.45],boss:['explode-large',.6],bad:['bite',.8],hit:['crunch',.6],smash:['crunch',.75],item:['pulse',.5],win:['magic',.6]};
const BUF={};let sfxLoading=false;
function loadSfx(){
 if(sfxLoading||!AC)return;sfxLoading=true;
 for(const [k,[f]] of Object.entries(SFX_FILES))fetch(`assets/sfx/${f}.mp3`).then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(b=>AC.decodeAudioData(b)).then(d=>{BUF[k]=d}).catch(()=>{});
}
function playBuf(n){
 const b=BUF[n];if(!b||!AC||muted)return false;
 try{const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=SFX_FILES[n][1];s.connect(g).connect(AC.destination);s.start();return true}catch(e){return false}
}
function tone(f,d,type='sine',vol=.14,slide){
 if(!AC||muted)return;
 try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
 if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}
}
function sfx(n){
 if(playBuf(n))return;
 if(n==='ok'){tone(660,.14,'triangle');setTimeout(()=>tone(990,.22,'triangle'),90)}
 else if(n==='bad'){tone(200,.4,'sawtooth',.12,60)}
 else if(n==='hit'){tone(140,.18,'square',.08,70)}
 else if(n==='smash'){tone(90,.25,'square',.1,40)}
 else if(n==='item'){tone(880,.08,'sine',.12);setTimeout(()=>tone(1320,.12,'sine',.1),60)}
 else if(n==='jump'){tone(420,.12,'sine',.07,700)}
 else if(n==='jump2'){tone(620,.12,'sine',.07,1100)}
 else if(n==='slide'){tone(300,.18,'triangle',.06,150)}
 else if(n==='block'){tone(1200,.25,'triangle',.1,600)}
 else if(n==='win'){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.3,'triangle',.12),i*130))}
}

/* ───────── 진행 ───────── */
const panel=$('#panel'),arena=$('#arena');
function showPanel(html){panel.innerHTML=html;panel.hidden=false;panel.scrollTop=0;arena.classList.add('panel-on')}
function hidePanel(){panel.hidden=true;panel.innerHTML='';arena.classList.remove('panel-on')}
function floater(text,col,x=PX,y=GROUND-160,size=26){G.floats.push({text,col,x,y,life:1.3,size})}
function burst(x,y,col,n,spd=1){for(let i=0;i<n;i++){const a=rand()*Math.PI*2,s=(120+rand()*260)*spd;G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-120,r:3+rand()*7,life:.6+rand()*.5,col})}}
function domShake(){arena.classList.remove('shake');void arena.offsetWidth;arena.classList.add('shake')}
function heal(n){const before=G.hp;G.hp=Math.min(G.maxHp,G.hp+n);floater(`HP +${G.hp-before}`,'#5fd3a9')}
function damage(n,fromQuiz){
 if(fromQuiz&&G.inv.shield>0){G.inv.shield--;P.shieldFx=1.2;floater('부적이 막았다!','#e9b949');sfx('block');return 0}
 /* 캐릭터 고유 능력: 궁수 회피 20% · 검객 불굴(HP 30% 이하 피해 절반) · 술사 맞으면 20% 확률로 HP +10 */
 {
  if(!fromQuiz&&G.char==='swift'&&rand()<.2){floater('회피!','#7fe0ff',PX,GROUND-170,30);sfx('jump2');P.inv=Math.max(P.inv,.4);return 0}
  if(G.char==='power'&&G.hp<=G.maxHp*.3){n=Math.max(1,Math.round(n*.5));floater('불굴','#ffb070',PX,GROUND-190,20)}
  if(!fromQuiz&&G.char==='brain'&&rand()<.2)setTimeout(()=>{if(G.hp>0)heal(10)},250);
 }
 G.hp=Math.max(0,G.hp-n);G.shake=fromQuiz?.5:.25;G.flash=fromQuiz?.55:.3;P.hurt=.9;P.knock=1;
 floater(`-${n}`,'#ff6a4d',PX,GROUND-160,fromQuiz?40:28);domShake();return n;
}
function jump(){
 if(G.state!=='run'&&G.state!=='dodge')return;
 P.slide=0;
 if(P.onGround){P.onGround=false;P.vy=-900;P.jumps=CH().jumps-1;P.sq=-.22;sfx('jump')}
 else if(P.jumps>0){P.jumps--;P.vy=-820;P.sq=-.2;sfx('jump2');burst(PX,GROUND+P.y,'#ffffff',8,.4)}
}
function slide(){
 if(G.state!=='run'&&G.state!=='dodge')return;
 if(!P.onGround){P.vy=Math.max(P.vy,1100);P.slide=.5;return}
 if(P.slide<=0)sfx('slide');P.slide=.62;
}

function start(){
 if(document.body.classList.contains('touch'))goFull();
 if(G.state==='title'&&!rangeCount()){domShake();const n=$('#rangeN');if(n)n.textContent='0 (단원을 골라 주세요) ';return}
 initAudio();const C=CH();
 Object.assign(G,{state:'run',stage:0,hp:C.hp,maxHp:C.hp,score:0,combo:0,maxCombo:0,correct:0,total:0,wrong:[],inv:{shield:C.shields,hint:C.hints},
  ents:[],parts:[],floats:[],bullets:[],dodge:null,cur:null,fade:.8,banner:null,mod:{dmg:1,time:0,score:1},journey:[],won:false});
 Object.assign(P,{y:0,vy:0,onGround:true,jumps:0,attack:0,hurt:0,knock:0,shieldFx:0,slide:0,dx:0,inv:0});setMovePad(false);
 if(URLSET.boss>=0){
  const S=STAGES[URLSET.boss];G.stage=URLSET.boss;G.journey.push(`시험 모드 · ${S.num} 보스만`);
  buildStage(G.stage,G.cam+700);G.ents=G.ents.filter(e=>e.kind==='enemy'&&e.boss);
  const b=G.ents[0];b.x=G.cam+PX+900;G.stTotal=1;G.stDone=0;
  G.state='run';G.banner={t:2.5,d:2.5,title:`${S.num} 보스 · ${MOBS[S.boss].name}`,sub:'시험 모드: 보스전만'};return;
 }
 if(URLSET.stage>0){
  const S=STAGES[URLSET.stage];G.stage=URLSET.stage;G.journey.push(`시험 모드 · ${S.num}부터`);
  buildStage(G.stage,G.cam+700);G.state='run';G.banner={t:3,d:3,title:`${S.num} · ${S.name}`,sub:'시험 모드: 이 장부터 시작'};return;
 }
 buildStage(0,G.cam+700);
 startStory(STORY.prologue,()=>{G.state='run';G.banner={t:3,d:3,title:'제1장 · 도화 마을',sub:'돌부리는 점프, 까마귀는 숙여서 피하자'}});
}
function toTitle(){const C=CH();G.state='title';G.ents=[];G.banner=null;G.stage=0;G.hp=G.maxHp=C.hp;G.score=0;G.combo=0;G.inv={shield:0,hint:0};G.fade=.6;P.slide=0;showTitle()}

function heroH(){return P.slide>0?60:125}
function interact(){
 const px=G.cam+PX;
 for(const e of G.ents){
  if(e.gone||e.used)continue;
  if(e.kind==='enemy'&&e.x-px<(e.boss?255:175)){e.used=true;if(e.boss)startDodge(e);else startQuiz(e);return}
  if(e.kind==='item'&&Math.abs(e.x-px)<34){const iy=e.y-GROUND;if(iy>P.y-140&&iy<P.y+30){e.used=true;e.gone=true;collect(e)}}
  if(e.kind==='obs'){
   const O=OBS[e.type];if(O.dyn==='scale'||Math.abs(e.x-px)>=O.w)continue;
   let hit;
   if(O.air){const top=P.y-heroH(),cy=-98+bobY(e),ah=O.ah||14;hit=top<cy+ah&&P.y>cy-ah}
   else if(O.dyn)hit=e.strike||(e.hNow>0&&P.y>-e.hNow+4);
   else hit=P.y>-O.h+4;
   if(hit){e.used=true;hitObs(e,O);if(G.hp<=0){gameOver();return}}
  }
 }
}
/* 위아래로 출렁이며 날아오는 공중 장애물(bob: [진폭, 빠르기]): 지금 높이 차이 */
/* 출렁이는 장애물의 높이 단서: 땅에 그림자(높을수록 작고 옅게), 낮으면 붉은 테(점프), 높으면 푸른 테(숙이기) */
function bobCue(e,sx,cy,r,ring=true){
 const b=OBS[e.type].bob;if(!b)return;const k=bobY(e)/b[0]; /* -1 높음 ~ 1 낮음 */
 cx.fillStyle=`rgba(0,0,0,${.18+.17*(k+1)/2})`;ell(cx,sx,GROUND+4,14+10*(k+1)/2,4+2*(k+1)/2);cx.fill();
 cx.strokeStyle='rgba(255,255,255,.18)';cx.setLineDash([3,6]);cx.lineWidth=1.5;cx.beginPath();cx.moveTo(sx,cy+r);cx.lineTo(sx,GROUND);cx.stroke();cx.setLineDash([]);
 if(!ring)return;
 cx.strokeStyle=k>.15?`rgba(255,70,50,${.5+.4*k})`:k<-.15?`rgba(90,190,255,${.5-.4*k})`:'rgba(255,255,255,.25)';cx.lineWidth=3;ell(cx,sx,cy,r,r);cx.stroke();
}
function bobY(e,t=G.t){const b=OBS[e.type].bob;return b?Math.sin(t*b[1]+e.seed*2)*b[0]:0}
/* 움직이는 함정 갱신: hNow가 지금 부딪히는 높이(0이면 안전) */
function updHaz(e,dt,moving){
 const O=OBS[e.type],H=HAZ[G.stage]||HAZ[4],px=G.cam+PX,sx=e.x-G.cam;
 if(O.dyn==='cycle'){const ph=(G.t/H.cycle+e.phase)%1;e.ph=ph;e.hNow=ph<.5?O.h*Math.min(1,ph/.06):0}
 else if(O.dyn==='geyser'){const ph=(G.t/(H.geyser||1.6)+e.phase)%1;e.ph=ph;e.hNow=ph>=.68?O.h*Math.min(1,(ph-.68)/.05):0;
  if(ph>=.68&&sx>-40&&sx<W+40&&rand()<.5)G.parts.push({x:sx+(rand()-.5)*30,y:GROUND-e.hNow*rand(),vx:(rand()-.5)*160,vy:-60-rand()*120,r:2+rand()*3,life:.5,col:'rgba(200,235,255,.8)'})}
 else if(O.dyn==='fall'){
  if(e.t<0&&e.x-px<e.trig)e.t=0;
  const fd=e.fd||.42;
  if(e.t>=0&&moving){const was=e.t;e.t+=dt;if(was<fd&&e.t>=fd){G.shake=Math.max(G.shake,.18);burst(sx,GROUND-6,e.type==='lavadrop'?'#ff7a2a':'#8a8070',12,.6);sfx('hit')}}
  e.hNow=e.t>=fd?O.h:0;
 }else if(O.dyn==='scale'){
  /* 오른쪽 위에서 주인공을 향해 대각선으로 날아온다. 0.4초 경고 후 발사 */
  if(e.t<0&&e.x-px<e.trig){e.t=0;e.sx=W-30;e.sy=-30}
  if(e.t>=0&&moving){e.t+=dt;
   if(e.t>=.4){if(!e.vxs){const tx=PX,ty=GROUND-70,dx=tx-e.sx,dy=ty-e.sy,d=Math.hypot(dx,dy),sp=880;e.vxs=dx/d*sp;e.vys=dy/d*sp;sfx('jump2')}
    e.sx+=e.vxs*dt;e.sy+=e.vys*dt;
    if(!e.used){const top=GROUND+P.y-heroH(),bot=GROUND+P.y;if(Math.abs(e.sx-PX)<20&&e.sy>top-6&&e.sy<bot){e.used=true;hitObs(e,O);if(G.hp<=0){gameOver();return}}}
    if(e.sy>GROUND+30||e.sx<-60)e.gone=true}
  }
  if(e.t>=0)e.x=G.cam+(e.sx??W);
 }else if(O.dyn==='bolt'){
  if(e.t<0&&e.x-px<e.trig)e.t=0;
  if(e.t>=0&&moving){const was=e.t;e.t+=dt;if(was<.45&&e.t>=.45){G.flash=Math.max(G.flash,.35);burst(sx,GROUND-10,'#fff3a0',16,.7);tone(120,.25,'sawtooth',.08,60)}}
  e.strike=e.t>=.45&&e.t<.6;e.hNow=e.t>=.45&&e.t<2.1?O.h:0;
 }
}
/* 보기 속 한자는 20% 크게 */
const hjBig=t=>t.replace(/[\u3400-\u9fff□]+/g,m=>`<span class="ohj">${m}</span>`);
const josa=(w,a,b)=>(w.charCodeAt(w.length-1)-0xAC00)%28?a:b;
/* 3~5장은 장애물이 많은 대신 한 번 부딪힐 때 피해를 70%로 */
const OBS_STAGE_MUL=[1,1,.7,.7,.7];
function hitObs(e,O){
 const C=CH(),n=Math.max(1,Math.round(O.dmg*OBS_STAGE_MUL[G.stage]*C.obsMul*G.mod.dmg));
 damage(n,false);e.fling=.8;
 if(O.dyn&&e.type!=='fallrock'&&e.type!=='lavadrop'){sfx('hit');floater(`${O.name}에 당했다`,'#f1ebdc',PX,GROUND-200,18)}
 else if(C.obsMul<1){sfx('smash');floater(`${O.name}${josa(O.name,'을','를')} 부쉈다`,'#f1ebdc',PX,GROUND-200,18);burst(e.x-G.cam,GROUND-20,'#6b6670',12)}
 else{sfx('hit');floater(`${O.name}에 부딪혔다`,'#f1ebdc',PX,GROUND-200,18)}
}
function collect(e){
 const I=ITEMS[e.type],C=CH();sfx('item');burst(e.x-G.cam,e.y,I.col,10);
 if(e.type==='yak')heal(Math.round(10*C.healMul));else if(e.type==='sam')heal(Math.round(25*C.healMul));
 else if(e.type==='bu'){G.inv.shield++;floater('부적 획득','#e9b949')}
 else{G.inv.hint++;floater('붓 획득','#8fb0e8')}
}

function startQuiz(e){
 G.state='quiz';P.slide=0;
 const q=e.boss?bossPick(e):e.q,lv=e.boss?4:q.l;
 G.cur={e,q,lv,opts:shuffle(q.o.map((t,i)=>({t,ok:i===0}))),time:Math.max(8,LV[lv].time+CH().time+G.mod.time),done:false,hint:false};
 G.cur.left=G.cur.time;
 renderQuiz();
}
function renderQuiz(){
 const c=G.cur,L=LV[c.lv],q=c.q,e=c.e,C=CH();
 const pts=Math.round(L.pts*C.scoreMul*G.mod.score),dmg=Math.round(L.dmg*C.dmgMul*G.mod.dmg);
 const pips=e.boss?`<span class="pips" title="보스의 남은 기력">${'●'.repeat(e.hp)}${'○'.repeat(e.max-e.hp)}</span>`:'';
 showPanel(`<div class="quiz">
  <div class="qmeta"><span class="lvl ${L.cls}">${L.name} · ${pts}점</span><span class="cat">${esc(q.u==='자전'?'자전 · ':q.u+'과 · ')}<b class="ctype">(${esc(q.c)})</b></span>${pips}<span class="dmg">오답 시 HP −${dmg}</span></div>
  <div class="timer"><i id="tbar"></i><b id="tnum">${c.time}초</b></div>
  ${e.boss?`<p class="boss-line"><img src="assets/portraits/${e.mob}.jpg" alt="">${MOBS[e.mob].name}: “${BOSSES[e.mob].lines[Math.min(BOSSES[e.mob].lines.length-1,e.max-e.hp)]}”</p>`:''}
  <p class="qtext">${esc(q.q)}</p>
  ${q.h?`<div class="han${q.h.replace(/\s/g,'').length>8?' long':''}">${esc(q.h)}</div>`:''}
  <div class="opts">${c.opts.map((o,i)=>`<button class="opt" id="opt${i}" data-act="opt" data-i="${i}"><kbd>${i+1}</kbd><span>${hjBig(esc(o.t))}</span></button>`).join('')}</div>
  <div class="tools"><button class="hintbtn" id="hintBtn" data-act="hint" ${G.inv.hint?'':'disabled'}>筆 붓으로 오답 2개 지우기 <em>×${G.inv.hint}</em></button>
  ${G.inv.shield?`<span class="shield-note">符 부적 ${G.inv.shield}장이 오답 피해를 막아 준다</span>`:''}</div>
  <div class="fb" id="fb" hidden></div></div>`);
}
function useHint(){
 const c=G.cur;if(!c||c.done||c.hint||G.inv.hint<1)return;
 c.hint=true;G.inv.hint--;
 const wrong=shuffle(c.opts.map((o,i)=>o.ok?-1:i).filter(i=>i>=0)).slice(0,2);
 wrong.forEach(i=>{const b=$('#opt'+i);b.disabled=true;b.classList.add('gone')});
 const hb=$('#hintBtn');hb.disabled=true;hb.querySelector('em').textContent='×'+G.inv.hint;
}
function answer(i){
 const c=G.cur;if(!c||c.done)return;c.done=true;G.total++;
 const ok=i>=0&&c.opts[i].ok,L=LV[c.lv],e=c.e,C=CH();
 c.ok=ok;c.pick=i;
 if(ok){
  G.correct++;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
  const bonus=G.combo>=3?Math.min(25,(G.combo-2)*5):0;
  /* 빨리 맞힐수록 추가 점수: 기본 점수의 최대 TIME_BONUS만큼. 술사의 추가 시간은 빼고 계산해 캐릭터끼리 공평하게 */
  const base=Math.max(1,c.time-C.time),frac=Math.max(0,Math.min(1,1-(c.time-c.left)/base));
  c.fast=Math.round(L.pts*TIME_BONUS*frac);
  c.gain=Math.round((L.pts+bonus+c.fast)*C.scoreMul*G.mod.score);G.score+=c.gain;
  P.attack=.45;P.happy=1.4;sfx('ok');setTimeout(()=>{G.hitstop=.09;G.zoom=1.06},140);
  if(e.boss){e.hp--;e.hit=.5;if(e.hp<=0)e.dying=1}else e.dying=.6;
  setTimeout(()=>{burst(e.x-G.cam,GROUND-(e.boss?80:50),'#141218',e.boss?40:24);sfx(e.boss&&e.hp<=0?'boss':'defeat')},120);
  floater(`+${c.gain}`,'#e9b949',e.x-G.cam,GROUND-(e.boss?230:150),34);
 }else{
  G.combo=0;G.wrong.push(c.q);e.lunge=.5;sfx('bad');
  c.dmg=damage(Math.round(L.dmg*C.dmgMul*G.mod.dmg),true);c.blocked=c.dmg===0;
 }
 renderFeedback();
}
function renderFeedback(){
 const c=G.cur;

const PATS={

 /* 일자탄: 발밑(점프) 또는 머리 높이(숙이기). 조준탄과 함께 나오는 스펠에서는 발밑으로만 */
 lines:{every:1.9,fire(d,bx,by,px,py,v){const low=d.SP.pat.includes('aimed')||rand()<.5;for(let i=0;i<3;i++)shoot(bx+i*26,low?GROUND-18:GROUND-100,-320*v,0)}},
 /* 글자비: 땅에 붉은 표시가 먼저 보인다. 주인공 바로 위에는 덜 떨어지게(한 번 다시 고름) */

 /* 회오리탄: 주인공을 겨누지 않고 위아래로 쓸며 날아온다. 높이를 보고 점프 · 숙이기 · 좌우로 피한다 */

   if(both&&p==='lines')every=2*PATS.aimed.every/B.spd;
   d.timer[p]=(d.timer[p]??(both&&p==='lines'?.2+PATS.aimed.every/B.spd/2:.2))-dt;if(d.timer[p]<=0){d.timer[p]=every;T.fire(d,bx,by,px,py,B.spd)}}

 G.speed+=(target-G.speed)*Math.min(1,dt*(target>G.speed?2.5:8));

 }else if(O.dyn)drawHaz(e,sx);
 cx.restore();
 // 1장에서는 피하는 방법을 위에 적어 준다
 if(G.stage===0&&!e.used&&sx>PX&&sx<W-40){
  const air=O.air;cx.font='700 14px "Noto Sans KR",sans-serif';cx.textAlign='center';
  const t=air?'↓ 숙이기':'↑ 점프',ty=air?GROUND-140:GROUND-62;
  cx.lineWidth=4;cx.strokeStyle='rgba(20,18,26,.75)';cx.strokeText(t,sx,ty);cx.fillStyle='#fff';cx.fillText(t,sx,ty);
 }
}
function drawBanner(){
 const b=G.banner;if(!b)return;
 const k=Math.max(0,Math.min(1,(b.d-b.t)/.35,b.t/.5));
 cx.save();cx.globalAlpha=k;cx.fillStyle='rgba(20,18,26,.82)';cx.beginPath();cx.moveTo(-10,180);
 for(let x=0;x<=W+10;x+=24)cx.lineTo(x,176+Math.sin(x*.07)*6);
 for(let x=W+10;x>=-10;x-=24)cx.lineTo(x,294+Math.sin(x*.05+1)*7);cx.closePath();cx.fill();
 cx.textAlign='center';cx.fillStyle='rgba(0,0,0,.5)';cx.font='66px "Nanum Brush Script",serif';cx.fillText(b.title,W/2+3,249);
 cx.fillStyle='#f6eedc';cx.fillText(b.title,W/2,246);
 cx.fillStyle='#e9b949';cx.font='19px "Noto Sans KR",sans-serif';cx.fillText(b.sub,W/2,278);
 const im=b.img&&portrait(b.img);
 if(im&&im.complete&&im.naturalWidth){const fw=118,fh=150,fx=46,fy=158,iw=im.naturalWidth,ih=im.naturalHeight;let sw=iw,sh=iw*fh/fw;if(sh>ih){sh=ih;sw=ih*fw/fh}
  cx.save();rr(cx,fx,fy,fw,fh,10);cx.clip();cx.drawImage(im,(iw-sw)/2,0,sw,sh,fx,fy,fw,fh);cx.restore();
  cx.strokeStyle='#e9b949';cx.lineWidth=3;rr(cx,fx,fy,fw,fh,10);cx.stroke()}
 cx.restore();
}
function drawPreviews(){
 for(const p of previews){
  const c=p.c,sel=p.id===G.char,C=CHARS[p.id];
  c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,240,240);
  const g=c.createRadialGradient(120,150,10,120,150,120);g.addColorStop(0,'rgba(21,20,27,.75)');g.addColorStop(1,'rgba(21,20,27,0)');c.fillStyle=g;c.fillRect(0,0,240,240);
  shadow(c,116,222,44,.45);
  c.save();c.translate(116,220);const s=1.45*C.scale;c.scale(s,s);
  drawHero(c,p.id,{phase:G.t*9,moving:sel,air:false,attack:0,hurt:false,slide:false,over:false,t:G.t});
  c.restore();
 }
}
function render(){
 cx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
 const S=STAGES[G.stage];
 cx.save();
 if(G.shake>0){const m=G.shake*16;cx.translate((rand()-.5)*m,(rand()-.5)*m)}
 if(G.zoom>1.001){const zx=PX+120,zy=GROUND-80;cx.translate(zx,zy);cx.scale(G.zoom,G.zoom);cx.translate(-zx,-zy)}
 drawBG(S);
 if(G.speed>150){cx.save();cx.strokeStyle='rgba(255,255,255,.14)';cx.lineWidth=2;cx.lineCap='round';cx.beginPath();
  for(let i=0;i<7;i++){const x=((i*263-G.t*1100)%1300+1300)%1300-160,y=110+hash(i)*300;cx.moveTo(x,y);cx.lineTo(x+70+hash(i+3)*60,y)}cx.stroke();cx.restore()}
 for(const e of G.ents)if(e.kind==='obs'&&!OBS[e.type].air)drawObs(e);
 for(const e of G.ents)if(e.kind==='item')drawItem(e);
 for(const e of G.ents)if(e.kind==='enemy')drawEnemy(e);
 drawPlayer();
 for(const e of G.ents)if(e.kind==='obs'&&OBS[e.type].air)drawObs(e);
 drawBullets();
 drawFG(S);
 for(const p of G.parts){cx.globalAlpha=Math.max(0,Math.min(1,p.life*2));cx.fillStyle=p.col;ell(cx,p.x,p.y,p.r,p.r);cx.fill()}
 cx.globalAlpha=1;cx.textAlign='center';
 for(const f of G.floats){cx.globalAlpha=Math.min(1,f.life*1.5);cx.font=`700 ${f.size}px "Noto Sans KR",sans-serif`;cx.lineWidth=5;cx.strokeStyle='rgba(20,18,26,.85)';cx.strokeText(f.text,f.x,f.y);cx.fillStyle=f.col;cx.fillText(f.text,f.x,f.y)}
 cx.globalAlpha=1;cx.restore();
 if(G.flash>0){const g=cx.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.9);g.addColorStop(0,'rgba(224,60,40,0)');g.addColorStop(1,`rgba(224,40,30,${Math.min(.75,G.flash*1.4)})`);cx.fillStyle=g;cx.fillRect(0,0,W,H)}
 if(G.fade>0){cx.fillStyle=`rgba(243,234,214,${Math.min(1,G.fade)})`;cx.fillRect(0,0,W,H)}
 drawBanner();
 if(G.state==='title')drawPreviews();
}

/* ───────── 입력 ───────── */
panel.addEventListener('click',ev=>{
 const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
 const a=b.dataset.act;initAudio();
 if(a==='start'||a==='retry')start();else if(a==='opt')answer(+b.dataset.i);else if(a==='hint')useHint();
 else if(a==='next')next();else if(a==='home')toTitle();else if(a==='cat')toggleCat(b);else if(a==='unit')toggleUnit(b);else if(a==='uall'||a==='unone')setUnits(a==='uall');else if(a==='char')pickChar(b);
 else if(a==='send')sendResult(b);
 else if(a==='snext'||a==='sdone')storyNext();else if(a==='sskip')storySkip();else if(a==='schoose')storyChoose(+b.dataset.i);else if(a==='sopt')storyAnswer(+b.dataset.i);
});
addEventListener('keydown',ev=>{
 const k=ev.key,c=G.cur;
 if(G.state==='story'&&G.story){const st=G.story;
  if(k==='Enter'&&(st.phase==='lines'||st.phase==='result')){ev.preventDefault();storyNext();return}
  if(k>='1'&&k<='4'){if(st.phase==='choose'){ev.preventDefault();storyChoose(+k-1);return}if(st.phase==='quiz'){ev.preventDefault();storyAnswer(+k-1);return}}
  return}
 if(G.state==='quiz'&&c){
  if(!c.done&&k>='1'&&k<='4'){const b=$('#opt'+(+k-1));if(b&&!b.disabled)answer(+k-1);ev.preventDefault();return}
  if(!c.done&&(k==='h'||k==='H'||k==='ㅗ')){useHint();return}
  if(c.done&&k==='Enter'){ev.preventDefault();next();return}
 }
 if(G.state==='dodge'){
  if(k==='ArrowLeft'||k==='a'||k==='A'||k==='ㅁ'){ev.preventDefault();P.mvL=true}
  else if(k==='ArrowRight'||k==='d'||k==='D'||k==='ㅇ'){ev.preventDefault();P.mvR=true}
 }
 if(G.state==='run'||G.state==='dodge'){
  if(k===' '||k==='ArrowUp'||k==='w'||k==='W'||k==='ㅈ'){ev.preventDefault();if(!ev.repeat)jump()}
  else if(k==='ArrowDown'||k==='s'||k==='S'||k==='ㄴ'){ev.preventDefault();slide()}
 }
});
addEventListener('keyup',ev=>{const k=ev.key;if(k==='ArrowLeft'||k==='a'||k==='A'||k==='ㅁ')P.mvL=false;if(k==='ArrowRight'||k==='d'||k==='D'||k==='ㅇ')P.mvR=false});
for(const [id,key] of [['leftBtn','mvL'],['rightBtn','mvR']]){const b=$('#'+id);b.addEventListener('pointerdown',ev=>{ev.preventDefault();P[key]=true});['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>{P[key]=false}))}
cv.addEventListener('pointerdown',()=>{initAudio();jump()});
$('#jumpBtn').addEventListener('pointerdown',ev=>{ev.preventDefault();initAudio();jump()});
$('#slideBtn').addEventListener('pointerdown',ev=>{ev.preventDefault();initAudio();slide()});
$('#mute').addEventListener('click',ev=>{muted=!muted;initAudio();bgmUpdate();ev.currentTarget.setAttribute('aria-pressed',muted);ev.currentTarget.setAttribute('aria-label',muted?'소리 켜기':'소리 끄기')});

if(document.fonts&&document.fonts.load){['21px "Noto Serif KR"','66px "Nanum Brush Script"','15px "Noto Sans KR"'].forEach(f=>document.fonts.load(f,'藥蔘符筆 한문 원정기').catch(()=>{}))}
G.hp=G.maxHp=CH().hp;
showTitle();
let last=performance.now();
const PERF={n:0,sum:0,slow:0};
function perfTick(ms){
 if(document.hidden||ms>1000)return;
 PERF.n++;PERF.sum+=ms;
 if(PERF.n>=90){const avg=PERF.sum/PERF.n;PERF.n=PERF.sum=0;
  if(avg>21&&(G.state==='run'||G.state==='dodge')){PERF.slow++;
   if(!LOWFX){LOWFX=true}else if(QUAL>.55){QUAL=Math.max(.55,QUAL-.15);resize()}}}
}
let bgmT=0;
function frame(now){perfTick(now-last);if((bgmT+=1)%15===0)bgmUpdate();let dt=Math.min(.05,(now-last)/1000);last=now;if(G.hitstop>0){G.hitstop-=dt;dt*=.06}update(dt);render();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
