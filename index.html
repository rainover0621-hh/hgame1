<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>한문 원정기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Brush+Script&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
/* Layout: 16:9 달리기 무대(캔버스) 위 HUD, 넓은 화면은 오른쪽 패널을 무대 위에 겹치고 좁은 화면은 아래로 쌓는다. 먹빛 바탕 + 단청 띠 하나. */
:root{
  --ink:#15141b; --ink-2:#1f1e28; --ink-3:#2a2935; --line:#3b3949;
  --text:#f1ebdc; --muted:#aaa4b6; --paper:#f3ead6;
  --verm:#e0533a; --jade:#3aa893; --gold:#e9b949; --blue:#6d8fc4; --plum:#b9548a;
  --display:"Nanum Brush Script","Gowun Batang",serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --han:"Noto Serif KR","Batang","AppleMyungjo",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;
  display:flex;justify-content:center;box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
kbd{font-family:var(--body);font-size:.78em;padding:1px 6px;border-radius:5px;border:1px solid var(--line);background:var(--ink);color:var(--muted)}

.game{width:100%;max-width:min(1120px,calc((100dvh - 120px) * 1.7778));min-width:0;container-type:inline-size;display:flex;flex-direction:column;gap:10px}
@media (max-width:760px){.game{max-width:none}}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 14px;background:var(--ink-2);border-radius:12px;position:relative;overflow:hidden}
.hud::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:repeating-linear-gradient(90deg,var(--jade) 0 22px,var(--verm) 22px 30px,var(--gold) 30px 36px,var(--blue) 36px 52px,var(--verm) 52px 58px)}
.hp{display:flex;align-items:center;gap:8px;flex:1 1 220px;min-width:0}
.lbl{font-weight:700;color:var(--muted);letter-spacing:.08em;font-size:12px}
.bar{flex:1;height:16px;background:var(--ink);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:100%;background:var(--jade);border-radius:999px;transition:width .35s ease,background-color .3s}
.bar i.mid{background:var(--gold)} .bar i.low{background:var(--verm);animation:pulse .8s infinite alternate}
@keyframes pulse{to{opacity:.55}}
#hpTxt{font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.mid{flex:1 1 180px;display:flex;flex-direction:column;gap:4px;min-width:0}
#stName{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:6px;background:var(--ink);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}
.right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.score{display:flex;align-items:baseline;gap:6px}
.score small{color:var(--muted);font-size:12px}
.score b{font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums;min-width:3ch;display:inline-block}
#combo{font-size:13px;color:var(--verm);min-width:4.5em}
.inv{font-family:var(--han);font-weight:700;display:flex;align-items:center;gap:3px;padding:2px 8px;border-radius:7px;background:var(--ink-3)}
.inv b{font-family:var(--body);font-size:13px;font-variant-numeric:tabular-nums}
.inv.on{box-shadow:inset 0 0 0 1px var(--gold)}
#mute{background:var(--ink-3);border:0;border-radius:7px;width:32px;height:28px}
#mute[aria-pressed="true"]{color:var(--muted);text-decoration:line-through}

/* 무대 */
.arena{position:relative}
.arena.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-9px,4px)}30%{transform:translate(8px,-5px)}45%{transform:translate(-6px,3px)}60%{transform:translate(5px,-2px)}80%{transform:translate(-2px,1px)}}
@media (prefers-reduced-motion:reduce){.arena.shake{animation:none}}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:var(--ink-3);touch-action:manipulation}
canvas{display:block;width:100%;height:100%}

/* 패널 */
.panel{margin-top:10px;background:rgba(21,20,27,.94);border:1px solid var(--line);border-radius:14px;padding:18px;overflow:auto;scrollbar-width:thin}
@container (min-width:760px){
  .panel{position:absolute;margin:0;top:12px;right:12px;bottom:12px;width:min(52%,540px);backdrop-filter:blur(6px)}
}
.eyebrow{margin:0;font-size:12px;letter-spacing:.12em;color:var(--gold)}
.panel h1{font-family:var(--display);font-weight:400;font-size:62px;line-height:1;margin:4px 0 8px;text-wrap:balance}
.panel h2{font-size:13px;letter-spacing:.1em;color:var(--muted);margin:18px 0 8px;font-weight:700}
.lede{margin:0 0 14px;max-width:60ch}
.go{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:10px;padding:12px 20px;background:var(--verm);color:#fff;font-size:17px;font-weight:700;box-shadow:0 4px 0 #8f2c1c;transition:transform .08s}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #8f2c1c}
.go kbd{background:rgba(0,0,0,.2);border-color:rgba(255,255,255,.3);color:#fff}
.ghost{border:1px solid var(--line);background:transparent;border-radius:10px;padding:11px 16px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.best{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--ink-3);border-radius:999px;padding:5px 12px;font-size:13px}
.chip small{color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:#08221d}
.chip[aria-pressed="true"] small{color:#0d3a31}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:400}
.lvl{display:inline-block;padding:1px 9px;border-radius:6px;font-size:12px;font-weight:700;color:#fff}
.l1{background:var(--blue)}.l2{background:var(--jade)}.l3{background:var(--plum)}.l4{background:var(--verm)}
.items{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.items li{display:flex;gap:10px;align-items:center;font-size:13px;min-width:0}
.items .ic{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--han);font-weight:700;color:#fff;border:2px solid var(--paper)}
.keys{font-size:13px;color:var(--muted);margin:0}
.keys kbd{margin:0 2px}

/* 문제 */
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.cat{color:var(--paper);border:1px solid var(--line);padding:0 8px;border-radius:6px}
.dmg{margin-left:auto;color:var(--verm)}
.pips{color:var(--verm);letter-spacing:2px}
.timer{position:relative;height:8px;margin:12px 0 4px;background:var(--ink-3);border-radius:9px}
.timer i{position:absolute;inset:0;background:var(--gold);border-radius:9px;transform-origin:left;transition:background-color .2s}
.timer i.warn{background:var(--verm)}
.timer b{position:absolute;right:0;top:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.boss-line{margin:14px 0 0;color:var(--gold);font-size:14px}
.qtext{font-size:17px;margin:14px 0 6px;text-wrap:pretty}
.han{font-family:var(--han);font-weight:700;font-size:44px;line-height:1.35;letter-spacing:.08em;text-align:center;padding:10px 6px;margin:6px 0 12px;background:var(--paper);color:#1b1a22;border-radius:10px;white-space:pre-line;overflow-wrap:anywhere}
.han.long{font-size:28px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--ink-3);transition:transform .1s,border-color .1s,opacity .2s}
.opt span{min-width:0}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateX(3px)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--jade);background:rgba(58,168,147,.22)}
.opt.no{border-color:var(--verm);background:rgba(224,83,58,.22)}
.opt.gone{opacity:.25;text-decoration:line-through}
.opt:disabled:not(.ok):not(.no){opacity:.5}
.opt span{font-family:var(--han),var(--body)}
.tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px;font-size:13px}
.hintbtn{border:1px dashed var(--blue);background:transparent;border-radius:8px;padding:6px 10px;font-size:13px}
.hintbtn:disabled{opacity:.4;cursor:default}
.hintbtn em{font-style:normal;color:var(--gold)}
.shield-note{color:var(--gold)}
.fb{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.v{font-size:20px;display:inline-block}
.v.ok{color:var(--jade)}.v.no{color:var(--verm)}
.fb .combo{color:var(--gold);font-size:14px;margin-left:6px}
.ans{margin:6px 0 0}
.ans b{font-family:var(--han),var(--body)}
.exp{color:var(--muted);margin:6px 0 14px;max-width:62ch}

/* 결과 */
.result .head{display:flex;gap:16px;align-items:center}
.seal{flex:none;width:84px;height:84px;border:4px solid var(--verm);border-radius:8px;color:var(--verm);font-family:var(--han);font-weight:700;font-size:30px;line-height:1;display:grid;place-items:center;transform:rotate(-6deg);writing-mode:vertical-rl;letter-spacing:.05em}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0}
.stats div{background:var(--ink-3);border-radius:10px;padding:10px}
.stats dt{font-size:12px;color:var(--muted)}
.stats dd{margin:0;font-size:22px;font-variant-numeric:tabular-nums}
@container (max-width:420px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.panel h1{font-size:52px}}
.notes{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.notes li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;background:var(--ink-3);border-radius:10px;padding:12px}
.notes .nh{font-family:var(--han);font-weight:700;font-size:20px;color:var(--paper);max-width:9em;white-space:pre-line}
.notes p{margin:0}
.notes .nq{font-size:13px;color:var(--muted)}
.notes .na{font-family:var(--han),var(--body);color:var(--jade);margin-top:2px}
.notes .ne{font-size:13px;margin-top:4px}
.empty{color:var(--muted);font-size:14px}

/* 캐릭터 고르기 */
.chars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.char{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;align-content:start;text-align:left;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--ink-3);transition:transform .12s,border-color .12s}
.char:hover{transform:translateY(-2px);border-color:var(--muted)}
.char[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:#2d2a27}
.char canvas{width:100%;height:auto;aspect-ratio:1;border-radius:8px;display:block}
.char .info{min-width:0;display:flex;flex-direction:column;gap:3px}
.char b{font-size:15px}
.role{font-size:11px;letter-spacing:.06em;color:var(--gold)}
.char[aria-pressed="true"] .role::after{content:" · 선택됨"}
.stat{display:grid;grid-template-columns:2.4em minmax(0,1fr);align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.stat span{height:5px;background:var(--ink);border-radius:9px;overflow:hidden}
.stat i{display:block;height:100%;border-radius:9px}
.abil{margin:2px 0 0;padding-left:14px;font-size:11.5px;line-height:1.45}
@container (max-width:520px){.chars{grid-template-columns:1fr}.char{grid-template-columns:104px minmax(0,1fr);column-gap:10px;align-items:center}}

.pad{display:none;justify-content:center;gap:10px}
.pad button{flex:1;max-width:260px;padding:14px;border-radius:12px;border:0;background:var(--ink-3);font-size:17px;font-weight:700;box-shadow:0 4px 0 #0b0a10;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #0b0a10}
@container (max-width:760px){.pad{display:flex}}
@media (pointer:coarse){.pad{display:flex}}
</style>
</head>
<body>

<div class="game">
  <header class="hud">
    <div class="hp"><span class="lbl">HP</span><div class="bar"><i id="hpFill"></i></div><b id="hpTxt">100/100</b></div>
    <div class="mid"><span id="stName">출발 전</span><div class="prog"><i id="prog"></i></div></div>
    <div class="right">
      <span class="score"><small>점수</small><b id="score">0</b></span>
      <span id="combo"></span>
      <span class="inv" id="invB" title="부적: 오답 피해 1회 막기">符<b>0</b></span>
      <span class="inv" id="invP" title="붓: 보기 2개 지우기">筆<b>0</b></span>
      <button id="mute" aria-pressed="false" aria-label="소리 끄기">♪</button>
    </div>
  </header>
  <div class="arena" id="arena">
    <div class="stage" id="stage"><canvas id="cv" aria-label="달리기 무대"></canvas></div>
    <section class="panel" id="panel" aria-live="polite"></section>
  </div>
  <div class="pad"><button id="jumpBtn">점프 ▲</button><button id="slideBtn">숙이기 ▼</button></div>
</div>

<script>
/* ───────── 문제 은행 ─────────
   [분류, 난이도(1 하 · 2 중 · 3 상), 질문, 크게 보여 줄 한자(없으면 ''), [정답, 오답, 오답, 오답], 풀이]
   보기는 첫 번째가 정답이며, 게임에서 자동으로 섞인다. 교과서 내용에 맞게 자유롭게 추가·수정하면 된다. */
const BANK = [
 ['한자',1,'다음 한자의 훈과 음은?','山',['뫼 산','내 천','돌 석','밭 전'],'山은 산봉우리 세 개가 솟은 모양을 본뜬 상형 문자로 ‘뫼 산’이다.'],
 ['한자',1,'다음 한자의 훈과 음은?','學',['배울 학','가르칠 교','글월 문','익힐 습'],'學은 ‘배울 학’. 學校(학교), 學生(학생) 등에 쓰인다.'],
 ['한자',1,'다음 한자의 훈과 음은?','孝',['효도 효','늙을 로','아들 자','가르칠 교'],'孝는 老(耂, 늙을 로)와 子(아들 자)가 합쳐진 글자로, 자식이 부모를 받드는 모습이다.'],
 ['한자',1,'‘바다 해’에 해당하는 한자는?','',['海','每','悔','梅'],'海는 뜻을 나타내는 氵(물 수)와 소리를 나타내는 每가 합쳐진 형성 문자이다.'],
 ['한자',1,'‘大(큰 대)’와 뜻이 반대되는 한자는?','',['小','太','少','天'],'大(큰 대) ↔ 小(작을 소). 少는 ‘적을 소’로 多(많을 다)와 반대된다.'],
 ['한자',1,'江 · 河 · 海 · 湖에 공통으로 들어 있는 부수는?','',['氵 (물 수)','木 (나무 목)','口 (입 구)','亻 (사람 인)'],'모두 물과 관련된 글자로, 부수 氵(삼수변, 물 수)가 들어 있다.'],
 ['한자',1,'사람(亻)이 나무(木) 곁에서 쉬는 모습을 나타낸 이 한자의 훈과 음은?','休',['쉴 휴','몸 체','근본 본','수풀 림'],'休는 亻(사람 인)과 木(나무 목)이 합쳐진 회의 문자로 ‘쉴 휴’이다.'],
 ['한자어휘',1,'다음 한자어의 독음은?','父母',['부모','부녀','모녀','조모'],'父(아버지 부) + 母(어머니 모). 뜻이 대등하게 나열된 병렬 관계이다.'],
 ['한자어휘',1,'‘나라를 사랑함’을 뜻하는 한자어는?','',['愛國','愛人','國家','國語'],'愛(사랑 애) + 國(나라 국). 서술어 + 목적어 짜임의 술목 관계이다.'],
 ['한자어휘',1,'다음 한자어의 뜻은?','春夏秋冬',['봄 여름 가을 겨울','동 서 남 북','해 달 별 구름','아침 낮 저녁 밤'],'春(봄 춘) 夏(여름 하) 秋(가을 추) 冬(겨울 동).'],
 ['한자성어',1,'다음 성어의 뜻은?','一石二鳥',['한 가지 일로 두 가지 이익을 얻음','한 번 시작한 일을 끝까지 함','돌처럼 굳은 마음','새가 둥지로 돌아옴'],'돌 하나(一石)로 새 두 마리(二鳥)를 잡는다는 뜻. 비슷한 말로 一擧兩得(일거양득)이 있다.'],
 ['고사성어',1,'빈칸에 들어갈 한자는? (어릴 때부터 함께 놀며 자란 벗)','竹馬□友',['故','苦','古','高'],'竹馬故友(죽마고우): 대나무 말을 타고 함께 놀던 옛 벗.'],
 ['문장풀이',1,'‘山高(산이 높다)’의 문장 짜임은?','山高',['주어 + 서술어','서술어 + 목적어','수식어 + 피수식어','대등한 나열'],'山(산이) + 高(높다). 주어와 서술어로 이루어진 주술 관계이다.'],
 ['기타',1,'사군자(四君子)에 속하지 않는 식물은?','',['松 (소나무)','梅 (매화)','蘭 (난초)','竹 (대나무)'],'사군자는 梅 · 蘭 · 菊 · 竹(매화 · 난초 · 국화 · 대나무)이다.'],
 ['기타',1,'한문 문장의 어순이 우리말과 다른 대표적인 점은?','',['서술어가 목적어보다 앞에 온다','주어가 항상 문장 끝에 온다','조사가 반드시 붙는다','꾸미는 말이 꾸밈받는 말 뒤에 온다'],'讀書(독서)는 讀(읽다) + 書(책을)의 순서. 우리말로는 ‘책을 읽다’가 된다.'],

 ['한자',2,'日 · 月 · 山 · 川처럼 사물의 모양을 본떠 만든 글자를 무엇이라 하는가?','',['상형(象形)','지사(指事)','회의(會意)','형성(形聲)'],'상형은 사물의 모양을 그대로 본떠 글자를 만드는 방법이다.'],
 ['한자',2,'上 · 下 · 本 · 末처럼 점이나 선으로 추상적인 뜻을 나타낸 글자는?','',['지사(指事)','상형(象形)','회의(會意)','형성(形聲)'],'지사는 모양으로 그리기 어려운 위치나 개념을 점 · 선으로 가리킨 글자이다. 本은 木의 아래(뿌리)에 표시를 한 것이다.'],
 ['한자',2,'日(해)과 月(달)을 합쳐 ‘밝다’는 뜻을 만든 이 글자의 원리는?','明',['회의(會意)','상형(象形)','지사(指事)','형성(形聲)'],'둘 이상의 글자를 뜻끼리 합쳐 새로운 뜻을 만드는 방법이 회의이다.'],
 ['한자',2,'淸 · 晴 · 請에서 공통으로 소리(음)를 나타내는 부분은?','',['靑','氵','日','言'],'淸(맑을 청), 晴(갤 청), 請(청할 청)은 모두 靑이 소리를 나타내는 형성 문자이다.'],
 ['한자어휘',2,'다음 한자어의 짜임은?','讀書',['술목 관계 (서술어 + 목적어)','주술 관계 (주어 + 서술어)','수식 관계','병렬 관계'],'讀(읽다) + 書(책을) → ‘책을 읽다’. 서술어 뒤에 목적어가 온다.'],
 ['한자어휘',2,'다음 한자어의 짜임은?','靑山',['수식 관계','주술 관계','술목 관계','병렬 관계'],'靑(푸른)이 山(산)을 꾸며 주는 수식 관계이다.'],
 ['한자어휘',2,'다음 한자어의 짜임은?','日出',['주술 관계','술목 관계','수식 관계','병렬 관계'],'日(해가) + 出(뜨다). 주어 + 서술어로 이루어졌다.'],
 ['한자어휘',2,'‘始作(시작)’과 뜻이 반대되는 한자어는?','',['終了','開始','出發','發生'],'始作(처음 시작함) ↔ 終了(끝마침). 開始 · 出發은 비슷한 뜻이다.'],
 ['한자어휘',2,'다음 중 짜임이 나머지와 다른 한자어는?','',['花開','登山','讀書','愛國'],'花開(꽃이 피다)는 주술 관계. 登山 · 讀書 · 愛國은 모두 서술어 + 목적어의 술목 관계이다.'],
 ['한자어휘',2,'‘有利(유리)’와 뜻이 반대되는 한자어는?','',['不利','利益','便利','有益'],'有利(이로움이 있음) ↔ 不利(이롭지 않음).'],
 ['한자성어',2,'다음 성어의 뜻은?','溫故知新',['옛것을 익히고 그것을 미루어 새것을 앎','따뜻한 옛 친구를 새로 사귐','옛 습관을 버리고 새로 시작함','새로운 것만 좇음'],'《논어》 위정편. 溫(익힐 온) 故(옛 고) 知(알 지) 新(새 신).'],
 ['한자성어',2,'다음 성어의 뜻은?','苦盡甘來',['고생 끝에 즐거움이 옴','달콤한 말 뒤에 괴로움이 옴','쓴 약이 몸에 좋음','즐거움이 다하면 슬픔이 옴'],'苦(쓸 고) 盡(다할 진) 甘(달 감) 來(올 래). 반대 뜻은 興盡悲來(흥진비래).'],
 ['한자성어',2,'다음 성어의 뜻은?','以心傳心',['말없이 마음과 마음으로 뜻이 통함','마음을 다해 정성을 쏟음','남의 마음을 헤아리지 못함','한마음 한뜻으로 뭉침'],'말이나 글이 아닌 마음으로 뜻을 전한다는 말이다.'],
 ['한자성어',2,'다음 성어에 담긴 자식의 도리는?','昏定晨省',['저녁에는 잠자리를 살피고 아침에는 문안을 드림','아침 일찍 일어나 공부함','저녁마다 하루를 반성함','새벽에 별을 보며 일함'],'昏(저녁 혼) 定(정할 정) 晨(새벽 신) 省(살필 성). 부모를 정성껏 섬기는 도리이다.'],
 ['고사성어',2,'다음 고사성어의 뜻은?','漁父之利',['둘이 다투는 사이에 제삼자가 이익을 봄','어부가 고기를 많이 잡음','작은 이익을 탐하다 큰 것을 잃음','부지런히 일해 부자가 됨'],'조개와 도요새가 다투는 사이에 어부가 둘 다 잡았다는 《전국책》의 이야기에서 나왔다.'],
 ['고사성어',2,'다음 고사성어의 뜻은?','矛盾',['말이나 행동의 앞뒤가 서로 맞지 않음','창과 방패로 나라를 지킴','적과 친구를 구별하지 못함','강한 자가 약한 자를 이김'],'무엇이든 뚫는 창(矛)과 무엇도 뚫지 못하는 방패(盾)를 함께 판 초나라 상인 이야기(《한비자》).'],
 ['고사성어',2,'다음 고사성어의 뜻은?','螢雪之功',['어려운 환경에서도 부지런히 공부한 보람','눈 오는 날 반딧불을 구경함','겨울에도 쉬지 않고 일함','작은 노력이 모여 큰 공을 이룸'],'반딧불(螢)과 눈빛(雪)에 비추어 책을 읽은 차윤과 손강의 이야기에서 나왔다.'],
 ['고사성어',2,'다음 고사성어의 뜻은?','塞翁之馬',['인생의 길흉화복은 미리 알 수 없음','늙은 말이 길을 앎','국경을 굳게 지킴','말을 잘 다루는 노인의 지혜'],'변방(塞) 노인(翁)의 말이 달아났다 돌아오고, 아들이 다쳤지만 그 덕에 전쟁을 피한 이야기.'],
 ['고사성어',2,'다음 고사성어의 뜻은?','杞憂',['쓸데없는 걱정','나라를 걱정하는 충성','근심 많은 왕','미리 대비함'],'기(杞)나라 사람이 하늘이 무너질까 걱정했다는 《열자》의 이야기에서 나왔다.'],
 ['문장풀이',2,'다음 문장의 풀이로 알맞은 것은?','學而時習之 不亦說乎',['배우고 때때로 그것을 익히면 또한 기쁘지 아니한가','배우고 때를 맞추어 말하면 또한 옳지 아니한가','때때로 배우기만 하면 기쁘지 아니하다','배운 것을 말로 설명하면 기쁘다'],'《논어》 학이편 첫 구절. 說은 여기서 ‘기쁠 열’로 읽는다.'],
 ['문장풀이',2,'이 문장에서 ‘說’의 훈과 음은?','學而時習之 不亦說乎',['기쁠 열','말씀 설','달랠 세','알릴 고'],'說은 뜻에 따라 말씀 설 · 달랠 세 · 기쁠 열로 읽는다. 여기서는 ‘기쁘다’는 뜻이다.'],
 ['문장풀이',2,'이 문장에서 ‘自’의 뜻으로 알맞은 것은?','有朋自遠方來 不亦樂乎',['~로부터','스스로','자기','저절로'],'自는 ‘스스로’ 외에 ‘~로부터’라는 뜻으로도 쓰인다. ‘벗이 먼 곳으로부터 찾아오면 또한 즐겁지 아니한가’.'],
 ['문장풀이',2,'다음 문장의 풀이로 알맞은 것은?','己所不欲 勿施於人',['자기가 원하지 않는 일을 남에게 하게 하지 말라','자기가 바라는 것은 남에게 먼저 베풀어라','남이 원하지 않는 일은 하지 않는다','자기 일은 남에게 맡기지 말라'],'《논어》 위령공편. 勿(~하지 말라)은 금지를 나타낸다.'],
 ['문장풀이',2,'다음 문장의 풀이로 알맞은 것은?','三人行 必有我師焉',['세 사람이 길을 가면 반드시 나의 스승이 있다','세 사람이 함께 가면 반드시 길을 잃는다','스승은 반드시 세 제자를 둔다','나는 세 분의 스승을 모신다'],'《논어》 술이편. 좋은 점은 본받고 나쁜 점은 고치니 누구에게서나 배울 수 있다는 뜻이다.'],
 ['문장풀이',2,'다음 문장의 풀이로 알맞은 것은?','父生我身 母鞠吾身',['아버지는 내 몸을 낳으시고 어머니는 내 몸을 기르셨다','아버지와 어머니는 나를 아끼신다','부모님께 몸과 마음을 다해 효도하라','아버지는 나를 가르치고 어머니는 나를 꾸짖으신다'],'《사자소학》의 첫 구절. 鞠은 ‘기를 국’이다.'],
 ['문장풀이',2,'다음 문장이 강조하는 것은?','玉不琢 不成器\n人不學 不知道',['배움의 중요성','옥의 아름다움','그릇을 만드는 기술','도덕보다 재물'],'《예기》 학기편. 옥은 다듬지 않으면 그릇이 되지 못하고, 사람은 배우지 않으면 도리를 알지 못한다.'],
 ['문장풀이',2,'이백의 〈靜夜思(정야사)〉의 주제로 알맞은 것은?','床前明月光 疑是地上霜\n擧頭望明月 低頭思故鄕',['고향을 그리워함','달빛의 아름다움 예찬','서리 내린 가을의 쓸쓸함','친구와의 이별'],'고개 들어 밝은 달을 바라보고(擧頭望明月), 고개 숙여 고향을 생각한다(低頭思故鄕).'],
 ['기타',2,'《논어》는 누구의 말과 행동을 기록한 책인가?','',['공자와 그 제자들','맹자','노자','주희'],'공자와 제자들의 말과 행동을 제자들이 엮은 책으로, 사서(四書) 가운데 하나이다.'],
 ['기타',2,'십이지(十二支) ‘子丑寅卯’에서 ‘寅’에 해당하는 동물은?','',['호랑이','쥐','소','토끼'],'子(쥐) 丑(소) 寅(호랑이) 卯(토끼) 辰(용) 巳(뱀) 午(말) 未(양) 申(원숭이) 酉(닭) 戌(개) 亥(돼지).'],
 ['기타',2,'《사자소학》의 다음 구절이 말하는 도리는?','兄友弟恭',['형은 아우를 사랑하고 아우는 형을 공경함','형과 아우는 친구처럼 지냄','형은 가르치고 아우는 배움','형제는 재산을 똑같이 나눔'],'友(우애할 우), 恭(공손할 공). 형제 사이의 도리를 말한다.'],

 ['고사성어',3,'다음 고사성어의 뜻은?','刻舟求劍',['융통성 없이 어리석게 한 가지만 고집함','배에 새기는 뛰어난 솜씨','칼을 갈며 복수를 다짐함','잃어버린 것을 끝까지 찾아냄'],'강물에 칼을 빠뜨리자 뱃전에 표시해 두었다가, 배가 멈춘 뒤 그 아래에서 칼을 찾은 초나라 사람 이야기(《여씨춘추》).'],
 ['고사성어',3,'그루터기를 지키며 토끼가 또 부딪히기를 기다린 농부 이야기에서 나온 성어는?','',['守株待兎','刻舟求劍','緣木求魚','塞翁之馬'],'守株待兎(수주대토): 우연한 행운만 바라며 융통성 없이 기다림(《한비자》).'],
 ['고사성어',3,'다음 고사성어의 뜻은?','結草報恩',['죽어서도 잊지 않고 은혜를 갚음','풀을 엮어 집을 지음','은혜를 원수로 갚음','작은 은혜에 크게 보답함'],'위과가 아버지의 첩을 살려 주자, 그 여인의 아버지 혼령이 풀을 엮어 적장을 넘어뜨려 은혜를 갚았다는 이야기.'],
 ['고사성어',3,'‘結草報恩’과 뜻이 가장 비슷한 성어는?','',['白骨難忘','背恩忘德','刻骨痛恨','得意洋洋'],'白骨難忘(백골난망): 죽어 백골이 되어도 은혜를 잊을 수 없음. 背恩忘德은 은혜를 저버린다는 뜻이다.'],
 ['고사성어',3,'다음 고사성어의 뜻은?','臥薪嘗膽',['원수를 갚거나 뜻을 이루려고 괴로움을 참고 견딤','편안히 누워 맛있는 것을 먹음','쓸개처럼 쓴 충고를 받아들임','땔나무를 하며 가난하게 삶'],'오왕 부차는 섶(薪)에 누워 자고, 월왕 구천은 쓸개(膽)를 맛보며 복수를 다짐한 이야기.'],
 ['고사성어',3,'다음 고사성어의 뜻은?','四面楚歌',['사방이 적에게 둘러싸여 도움을 받을 수 없는 처지','사방에서 즐거운 노래가 들림','네 나라가 힘을 합침','어디서나 환영받는 인기'],'한나라 군대에 포위된 항우가 사방에서 들려오는 초나라 노래를 듣고 절망한 이야기(《사기》).'],
 ['고사성어',3,'다음 고사성어의 뜻은?','五十步百步',['조금 차이는 있으나 본질적으로는 같음','오십 걸음이 백 걸음보다 낫다','작은 노력이 모여 큰 성과를 냄','천천히 가도 결국 도착함'],'싸움터에서 오십 보 달아난 병사가 백 보 달아난 병사를 비웃는다는 맹자의 비유(《맹자》).'],
 ['고사성어',3,'다음 고사성어의 뜻은?','管鮑之交',['서로를 깊이 이해하고 믿는 두터운 우정','관청과 백성의 사귐','이익을 위해 맺은 관계','스승과 제자의 관계'],'춘추 시대 제나라 관중과 포숙아의 변치 않는 우정에서 나온 말이다.'],
 ['고사성어',3,'다음 고사성어의 뜻은?','孟母三遷',['교육에는 주위 환경이 중요함','어머니가 세 번 꾸짖음','세 번 생각하고 행동함','세 번 실패해도 다시 도전함'],'맹자의 어머니가 아들 교육을 위해 묘지 근처 → 시장 근처 → 서당 근처로 세 번 이사한 이야기.'],
 ['고사성어',3,'다음 고사성어의 뜻은?','畫龍點睛',['가장 중요한 부분을 마무리하여 일을 완성함','용을 그리다 뱀을 그림','그림 솜씨가 뛰어남','쓸데없는 것을 덧붙여 일을 망침'],'용 그림에 눈동자를 그려 넣자 용이 하늘로 날아갔다는 이야기. 쓸데없는 것을 덧붙인다는 뜻은 蛇足(사족)이다.'],

function hex(c){const n=parseInt(c.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function mix(a,b,t){const A=hex(a),B=hex(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
const shade=(c,t)=>t<0?mix(c,'#000000',-t):mix(c,'#ffffff',t);

function pick(lvls){
 let pool=BANK.filter(q=>G.cats.has(q.c)&&!G.used.has(q.id));
 if(!pool.length){G.used.clear();pool=BANK.filter(q=>G.cats.has(q.c))}
 let c=pool.filter(q=>lvls.includes(q.l));
 if(!c.length)c=pool;
 const q=c[Math.floor(rand()*c.length)];G.used.add(q.id);return q;
}
function pickItem(){
 const keys=Object.keys(ITEMS),tot=keys.reduce((s,k)=>s+ITEMS[k].w,0);let r=rand()*tot;
 for(const k of keys){r-=ITEMS[k].w;if(r<=0)return k}return 'yak';
}
function addObs(type,x){const O=OBS[type];G.ents.push({kind:'obs',type,x,vx:O.vx||0,rot:0,seed:rand()*9})}
function buildStage(i,x0){
 const S=STAGES[i];let x=x0;
 S.enemies.forEach((lvl,k)=>{
  const gap=k===0?760:1000+rand()*300;
  if(k===0&&i===0)addObs('rock',x+gap*.3);
  else if(k>0){
   const t=S.obs[Math.floor(rand()*S.obs.length)];
   addObs(t,x+gap*(OBS[t].vx?.42:.28));
   if(rand()<.45){const t2=S.obs[Math.floor(rand()*S.obs.length)];if(!OBS[t2].vx)addObs(t2,x+gap*.84)}
  }
  if(k===0||rand()<.65){const air=k>0&&rand()<.55;G.ents.push({kind:'item',type:k===0&&i===0?'pil':pickItem(),x:x+gap*(k===0?.6:.6),y:air?GROUND-165:GROUND-28,air})}
  x+=gap;
  const q=pick([lvl]);G.ents.push({kind:'enemy',x,q,lvl:q.l});
 });
 if(S.boss){
  x+=1300;
  G.ents.push({kind:'item',type:'sam',x:x-820,y:GROUND-28});
  addObs('crow',x-500);
  G.ents.push({kind:'item',type:'bu',x:x-380,y:GROUND-165,air:true});
  G.ents.push({kind:'enemy',boss:true,x,hp:3,max:3,lvl:4});
 }
 G.stDone=0;G.stTotal=S.enemies.length+(S.boss?1:0);
}

/* ───────── 소리 ───────── */
let AC=null,muted=false;
function initAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){AC=null}}
function tone(f,d,type='sine',vol=.14,slide){
 if(!AC||muted)return;
 try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
 if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}
}
function sfx(n){
 if(n==='ok'){tone(660,.14,'triangle');setTimeout(()=>tone(990,.22,'triangle'),90)}
 else if(n==='bad'){tone(200,.4,'sawtooth',.12,60)}
 else if(n==='hit'){tone(140,.18,'square',.08,70)}
 else if(n==='smash'){tone(90,.25,'square',.1,40)}
 else if(n==='item'){tone(880,.08,'sine',.12);setTimeout(()=>tone(1320,.12,'sine',.1),60)}
 else if(n==='jump'){tone(420,.12,'sine',.07,700)}
 else if(n==='jump2'){tone(620,.12,'sine',.07,1100)}
 else if(n==='slide'){tone(300,.18,'triangle',.06,150)}
 else if(n==='block'){tone(1200,.25,'triangle',.1,600)}
 else if(n==='win'){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.3,'triangle',.12),i*130))}
}

const panel=$('#panel'),arena=$('#arena');
function showPanel(html){panel.innerHTML=html;panel.hidden=false;panel.scrollTop=0}
function hidePanel(){panel.hidden=true;panel.innerHTML=''}
function floater(text,col,x=PX,y=GROUND-160,size=26){G.floats.push({text,col,x,y,life:1.3,size})}
function burst(x,y,col,n,spd=1){for(let i=0;i<n;i++){const a=rand()*Math.PI*2,s=(120+rand()*260)*spd;G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-120,r:3+rand()*7,life:.6+rand()*.5,col})}}
function domShake(){arena.classList.remove('shake');void arena.offsetWidth;arena.classList.add('shake')}
function heal(n){const before=G.hp;G.hp=Math.min(G.maxHp,G.hp+n);floater(`HP +${G.hp-before}`,'#5fd3a9')}
function damage(n,fromQuiz){
 if(fromQuiz&&G.inv.shield>0){G.inv.shield--;P.shieldFx=1.2;floater('부적이 막았다!','#e9b949');sfx('block');return 0}
 G.hp=Math.max(0,G.hp-n);G.shake=fromQuiz?.5:.25;G.flash=fromQuiz?.55:.3;P.hurt=.9;P.knock=1;
 floater(`-${n}`,'#ff6a4d',PX,GROUND-160,fromQuiz?40:28);domShake();return n;
}
function jump(){
 if(G.state!=='run')return;
 P.slide=0;
 if(P.onGround){P.onGround=false;P.vy=-900;P.jumps=CH().jumps-1;sfx('jump')}
 else if(P.jumps>0){P.jumps--;P.vy=-820;sfx('jump2');burst(PX,GROUND+P.y,'#ffffff',8,.4)}
}
function slide(){
 if(G.state!=='run')return;
 if(!P.onGround){P.vy=Math.max(P.vy,1100);P.slide=.5;return}
 if(P.slide<=0)sfx('slide');P.slide=.62;
}

 document.activeElement&&document.activeElement.blur&&document.activeElement.blur();
}
function toTitle(){const C=CH();G.state='title';G.ents=[];G.banner=null;G.stage=0;G.hp=G.maxHp=C.hp;G.score=0;G.combo=0;G.inv={shield:0,hint:0};G.fade=.6;P.slide=0;showTitle()}

function heroH(){return P.slide>0?60:125}
function interact(){
 const px=G.cam+PX;
 for(const e of G.ents){
  if(e.gone||e.used)continue;
  if(e.kind==='enemy'&&e.x-px<(e.boss?165:175)){e.used=true;startQuiz(e);return}
  if(e.kind==='item'&&Math.abs(e.x-px)<34){const iy=e.y-GROUND;if(iy>P.y-140&&iy<P.y+30){e.used=true;e.gone=true;collect(e)}}
  if(e.kind==='obs'){
   const O=OBS[e.type];if(Math.abs(e.x-px)>=O.w)continue;
   let hit;
   if(O.air){const top=P.y-heroH(),cy=-98;hit=top<cy+14&&P.y>cy-14}
   else hit=P.y>-O.h+4;
   if(hit){e.used=true;hitObs(e,O);if(G.hp<=0){gameOver();return}}
  }
 }
}
const josa=(w,a,b)=>(w.charCodeAt(w.length-1)-0xAC00)%28?a:b;
function hitObs(e,O){
 const C=CH(),n=Math.max(1,Math.round(O.dmg*C.obsMul));
 damage(n,false);e.fling=.8;
 if(C.obsMul<1){sfx('smash');floater(`${O.name}${josa(O.name,'을','를')} 부쉈다`,'#f1ebdc',PX,GROUND-200,18);burst(e.x-G.cam,GROUND-20,'#6b6670',12)}
 else{sfx('hit');floater(`${O.name}에 부딪혔다`,'#f1ebdc',PX,GROUND-200,18)}
}
function collect(e){
 const I=ITEMS[e.type],C=CH();sfx('item');burst(e.x-G.cam,e.y,I.col,10);
 if(e.type==='yak')heal(Math.round(10*C.healMul));else if(e.type==='sam')heal(Math.round(25*C.healMul));
 else if(e.type==='bu'){G.inv.shield++;floater('부적 획득','#e9b949')}
 else{G.inv.hint++;floater('붓 획득','#8fb0e8')}
}

function startQuiz(e){
 G.state='quiz';P.slide=0;
 const q=e.boss?pick([3,2]):e.q,lv=e.boss?4:q.l;
 G.cur={e,q,lv,opts:shuffle(q.o.map((t,i)=>({t,ok:i===0}))),time:LV[lv].time+CH().time,done:false,hint:false};
 G.cur.left=G.cur.time;
 renderQuiz();
}
function renderQuiz(){
 const c=G.cur,L=LV[c.lv],q=c.q,e=c.e,C=CH();
 const pts=Math.round(L.pts*C.scoreMul),dmg=Math.round(L.dmg*C.dmgMul);
 const pips=e.boss?`<span class="pips" title="대왕의 남은 기력">${'●'.repeat(e.hp)}${'○'.repeat(e.max-e.hp)}</span>`:'';
 showPanel(`<div class="quiz">
  <div class="qmeta"><span class="lvl ${L.cls}">${L.name} · ${pts}점</span><span class="cat">${esc(q.c)}</span>${pips}<span class="dmg">오답 시 HP −${dmg}</span></div>
  <div class="timer"><i id="tbar"></i><b id="tnum">${c.time}초</b></div>
  ${e.boss?`<p class="boss-line">먹도깨비 대왕: “내 기력 세 칸을 모두 깎아 보거라!”</p>`:''}
  <p class="qtext">${esc(q.q)}</p>
  ${q.h?`<div class="han${q.h.replace(/\s/g,'').length>8?' long':''}">${esc(q.h)}</div>`:''}

function update(dt){
 G.t+=dt;
 const target=G.state==='run'?280:G.state==='title'?200:G.state==='win'?110:0;
 G.speed+=(target-G.speed)*Math.min(1,dt*(target>G.speed?2.5:8));
 if(G.speed<1&&target===0)G.speed=0;
 G.cam+=G.speed*dt;P.phase+=dt*G.speed/30;
 if(!P.onGround){P.vy+=2300*dt;P.y+=P.vy*dt;if(P.y>=0){P.y=0;P.vy=0;P.onGround=true}}
 P.attack=Math.max(0,P.attack-dt);P.hurt=Math.max(0,P.hurt-dt);P.knock=Math.max(0,P.knock-dt*2.4);P.shieldFx=Math.max(0,P.shieldFx-dt);
 if(P.onGround)P.slide=Math.max(0,P.slide-dt);
 G.shake=Math.max(0,G.shake-dt);G.flash=Math.max(0,G.flash-dt);G.fade=Math.max(0,G.fade-dt*1.4);
 if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null}
 const moving=G.state==='run';
 for(const e of G.ents){
  if(e.dying>0){e.dying-=dt;if(e.dying<=0){e.dying=0;e.gone=true}}
  if(e.lunge>0)e.lunge-=dt;if(e.hit>0)e.hit-=dt;
  if(e.kind==='obs'){
   if(moving&&e.vx&&!e.fling)e.x+=e.vx*dt;
   if(e.type==='log'&&moving)e.rot-=dt*(G.speed-e.vx)/22;
   if(e.fling>0){e.fling-=dt;if(e.fling<=0)e.gone=true}
  }
 }
 if(G.state==='run')interact();
 G.ents=G.ents.filter(e=>!e.gone&&e.x>G.cam-200);
 for(const p of G.parts){p.vy+=700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.y>GROUND+10){p.y=GROUND+10;p.vy*=-.3;p.vx*=.6}}
 G.parts=G.parts.filter(p=>p.life>0);
 for(const f of G.floats){f.life-=dt;f.y-=50*dt}
 G.floats=G.floats.filter(f=>f.life>0);
 const c=G.cur;
 if(G.state==='quiz'&&c&&!c.done){
  c.left-=dt;const tb=$('#tbar'),tn=$('#tnum');
  if(tb){tb.style.transform=`scaleX(${Math.max(0,c.left/c.time)})`;tb.classList.toggle('warn',c.left<6)}
  if(tn)tn.textContent=Math.max(0,Math.ceil(c.left))+'초';
  if(c.left<=0)answer(-1);
 }
 hud();
}

function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function ell(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2)}
function poly(c,pts){c.beginPath();c.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);c.closePath()}
function lgrad(c,x0,y0,x1,y1,stops){const g=c.createLinearGradient(x0,y0,x1,y1);stops.forEach(([o,col])=>g.addColorStop(o,col));return g}
function sphere(c,x,y,r,col){const g=c.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);g.addColorStop(0,shade(col,.35));g.addColorStop(.55,col);g.addColorStop(1,shade(col,-.35));return g}
function shadow(c,x,y,rx,a=.25){const g=c.createRadialGradient(x,y,0,x,y,rx);g.addColorStop(0,`rgba(0,0,0,${a})`);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;ell(c,x,y,rx,rx*.24);c.fill()}

 rr(c,-w/2,-3,w,27,w/2);c.fill();
 c.translate(0,22);c.rotate(kn);
 rr(c,-w/2+.5,-3,w-1,26,(w-1)/2);c.fill();
 c.translate(0,22);
 const sc=back?shade(L.shoe,-.2):L.shoe;
 c.fillStyle=sc;rr(c,-6,-3,w+9,9,4.5);c.fill();
 c.fillStyle=L.sole;c.fillRect(-6,4,w+9,2.6);
 c.fillStyle='rgba(255,255,255,.35)';c.fillRect(-2,-2,w,2);

 c.fillStyle=back?shade(L.skin,-.15):L.skin;ell(c,0,17,w*.55,w*.55);c.fill();
 if(weapon){
  c.translate(0,17);c.rotate(-1.75);
  const big=L.weapon==='bigbrush',k=big?1.35:1;c.scale(k,k);
  c.fillStyle=lgrad(c,-3,0,3,0,[[0,'#5a3414'],[.5,'#9a6330'],[1,'#5a3414']]);rr(c,-2.6,-12,5.2,50,2.4);c.fill();
  c.fillStyle='#e9b949';c.fillRect(-3,6,6,3);c.fillRect(-3,24,6,3);
  c.fillStyle='#efe4c8';c.fillRect(-3.6,36,7.2,4);
  c.fillStyle='#141218';c.beginPath();c.moveTo(-4.8,40);c.quadraticCurveTo(-6.5,54,0,67);c.quadraticCurveTo(6.5,54,4.8,40);c.closePath();c.fill();
  c.fillStyle='rgba(255,255,255,.25)';c.fillRect(-1.5,-10,1.4,44);
 }
 c.restore();
}
function heroTorso(c,L,id){
 const w=L.torsoW,x=-w/2+2;
 c.fillStyle=lgrad(c,x,0,x+w,0,[[0,shade(L.jacket,-.28)],[.55,L.jacket],[1,shade(L.jacket,.12)]]);
 rr(c,x,-46,w,48,10);c.fill();
 if(id==='power'){
  // 흰 셔츠 위 조끼
  c.fillStyle=lgrad(c,x,0,x+w,0,[[0,shade(L.vest,-.3)],[.6,L.vest],[1,shade(L.vest,.12)]]);

function drawHero(c,id,o){

 else if(o.slide){c.translate(0,16);c.rotate(-1.05)}
 const run=o.moving&&!o.slide;
 c.translate(0,run?-Math.abs(Math.sin(ph))*5:(o.moving||o.air?0:Math.sin(o.t*2.5)*1.2));
 const lean=o.slide?0:run?.15:(o.air?.06:.02);
 let tf,tb,kf,kb,af,ab,ef=-1,eb=-1;
 if(o.slide){tf=-.55;tb=-.4;kf=.15;kb=.35;af=-.35;ab=-.1;ef=-.25;eb=-.2}
 else if(o.air){tf=-.95;kf=1.4;tb=.55;kb=.95;af=-2.2;ab=.9;ef=-.6;eb=-.8}
 else if(run){tf=-Math.sin(ph)*.85;tb=Math.sin(ph)*.85;kf=.2+1*Math.max(0,Math.sin(ph+1.6));kb=.2+1*Math.max(0,Math.sin(ph+1.6+Math.PI));af=Math.sin(ph)*.95;ab=-Math.sin(ph)*.95;ef=-1.25;eb=-1.25}
 else{tf=-.06;tb=.06;kf=.06;kb=.06;af=.15+Math.sin(o.t*2.5)*.04;ab=-.1;ef=-.5;eb=-.3}
 if(o.attack>0){const k=1-o.attack;af=2.6-k*3.9;ef=-.25}
 const hipY=-50;
 const upper=fn=>{c.save();c.translate(0,hipY);c.rotate(lean);fn();c.restore()};
 upper(()=>heroBag(c,L,id));
 heroLeg(c,L,-2,hipY,tb,kb,true);
 upper(()=>heroArm(c,L,ab,eb,true,false,o));
 upper(()=>heroTorso(c,L,id));
 heroLeg(c,L,3,hipY,tf,kf,false);
 upper(()=>{heroHead(c,L,id,o);heroArm(c,L,af,ef,false,true,o)});
 c.restore();
}

function drawEnemy(e){
 const sx=e.x-G.cam;if(sx<-200||sx>W+220)return;
 const boss=!!e.boss,base=boss?1.75:1;let a=1,sc=base;
 if(e.dying>0){const k=e.dying/(boss?1:.6);a=k;sc=base*(.4+.6*k)}
 let off=0;if(e.lunge>0){const k=1-e.lunge/.5;off=-Math.sin(k*Math.PI)*(boss?130:115)}
 const jx=e.hit>0?Math.sin(e.hit*70)*7:0,bob=Math.sin(G.t*4+e.x*.01)*4;
 shadow(cx,sx+off,GROUND+4,40*sc,.3*a);
 cx.save();cx.globalAlpha=a;cx.translate(sx+off+jx,GROUND);
 cx.scale(sc,sc);cx.translate(0,bob*.5);
 const col=ECOL[e.lvl];
 cx.fillStyle=sphere(cx,-14,-5,10,'#2a2230');ell(cx,-14,-5,10,6);cx.fill();ell(cx,14,-5,10,6);cx.fill();
 if(!boss){cx.fillStyle=lgrad(cx,-30,-100,-8,-72,[[0,'#fff8e6'],[1,'#c9b892']]);poly(cx,[-22,-72,-30,-98,-8,-80]);cx.fill();poly(cx,[10,-80,22,-100,24,-72]);cx.fill()}
 cx.fillStyle=sphere(cx,0,-44,40,col);ell(cx,0,-44,36,40);cx.fill();
 cx.fillStyle='rgba(255,255,255,.28)';ell(cx,-14,-64,9,5);cx.fill();
 cx.fillStyle='rgba(0,0,0,.25)';ell(cx,18,-62,6,4);cx.fill();ell(cx,24,-36,4,3);cx.fill();
 const hit=e.hit>0||e.dying>0;
 if(hit){cx.strokeStyle='#fff';cx.lineWidth=3;for(const ex of[-14,6]){cx.beginPath();cx.moveTo(ex-5,-58);cx.lineTo(ex+5,-48);cx.moveTo(ex+5,-58);cx.lineTo(ex-5,-48);cx.stroke()}}
 else{cx.fillStyle=boss?'#ffd84a':'#fff';ell(cx,-14,-53,9,10);cx.fill();ell(cx,6,-53,9,10);cx.fill();
  cx.fillStyle=boss?'#c8372a':'#141218';ell(cx,-17,-52,4,4.5);cx.fill();ell(cx,3,-52,4,4.5);cx.fill();
  cx.fillStyle='#fff';ell(cx,-18,-54,1.3,1.3);cx.fill();ell(cx,2,-54,1.3,1.3);cx.fill()}
 cx.strokeStyle='#120d16';cx.lineWidth=3;cx.beginPath();cx.moveTo(-24,-68);cx.lineTo(-8,-63);cx.moveTo(14,-68);cx.lineTo(-1,-63);cx.stroke();
 cx.fillStyle='#1a0f14';cx.beginPath();cx.moveTo(-18,-32);cx.quadraticCurveTo(-6,-18,8,-32);cx.closePath();cx.fill();
 cx.fillStyle='#fff';cx.beginPath();cx.moveTo(-14,-31);cx.lineTo(-11,-25);cx.lineTo(-8,-31);cx.moveTo(0,-31);cx.lineTo(3,-25);cx.lineTo(6,-31);cx.fill();
 if(boss){
  cx.fillStyle='#efe2c4';poly(cx,[14,-96,26,-128,24,-92]);cx.fill();
  cx.fillStyle='rgba(20,18,24,.92)';ell(cx,0,-80,54,8);cx.fill();rr(cx,-19,-112,38,32,8);cx.fill();
  cx.fillStyle='rgba(255,255,255,.12)';rr(cx,-15,-110,8,26,4);cx.fill();
  cx.strokeStyle='#e9b949';cx.lineWidth=2;cx.beginPath();cx.moveTo(-30,-78);cx.quadraticCurveTo(-34,-40,-26,-14);cx.stroke();
  const swing=e.lunge>0?Math.sin((1-e.lunge/.5)*Math.PI)*1.6:0;
  cx.save();cx.translate(30,-46);cx.rotate(-.5-swing);
  cx.fillStyle=lgrad(cx,-10,0,10,0,[[0,'#4e2e12'],[.5,'#a06a36'],[1,'#4e2e12']]);rr(cx,-6,-58,12,58,6);cx.fill();rr(cx,-10,-70,20,30,10);cx.fill();
  for(const[dx,dy]of[[-6,-62],[5,-58],[-3,-48],[6,-46]]){cx.fillStyle=sphere(cx,dx,dy,3,'#e9b949');ell(cx,dx,dy,2.8,2.8);cx.fill()}
  cx.restore();
 }else{cx.fillStyle=sphere(cx,30,-40,8,col);ell(cx,30,-40,8,6);cx.fill();ell(cx,-32,-40,8,6);cx.fill()}
 cx.restore();
 if(!(e.dying>0)){
  const label=boss?'먹도깨비 대왕':e.q.c,ty=GROUND-(boss?222:118)+bob;
  cx.font='15px "Gowun Dodum",sans-serif';const tw=cx.measureText(label).width+22;
  cx.fillStyle='rgba(0,0,0,.2)';rr(cx,sx+off-tw/2+3,ty-10,tw,26,4);cx.fill();

function drawItem(e){
 const sx=e.x-G.cam;if(sx<-60||sx>W+60)return;
 const I=ITEMS[e.type],y=e.y+Math.sin(G.t*3+e.x)*5;

 const spin=Math.cos(G.t*2.6+e.x*.01),ws=Math.max(.12,Math.abs(spin)),side=spin>=0?1:-1;
 // 메달 두께(옆면)

 cx.fillStyle=fg;ell(cx,sx,y,18*ws,18);cx.fill();

function drawObs(e){
 const sx=e.x-G.cam;if(sx<-80||sx>W+80)return;
 const O=OBS[e.type];
 cx.save();
 let fy=0;
 if(e.fling>0){const k=1-e.fling/.8;cx.globalAlpha=1-k;fy=-Math.sin(k*Math.PI)*60;cx.translate(sx+k*140,GROUND+fy);cx.rotate(k*4);cx.translate(-sx,-GROUND)}

 if(e.type==='rock'){
  cx.fillStyle='#55505c';poly(cx,[sx-26,GROUND+4,sx-20,GROUND-22,sx-4,GROUND-36,sx+16,GROUND-28,sx+27,GROUND+4]);cx.fill();
  cx.fillStyle='#8e8996';poly(cx,[sx-20,GROUND-22,sx-4,GROUND-36,sx+4,GROUND-16,sx-12,GROUND-8]);cx.fill();

 }else if(e.type==='puddle'){
  const g=cx.createRadialGradient(sx-8,GROUND,2,sx,GROUND+2,42);g.addColorStop(0,'#3a3546');g.addColorStop(.7,'#141218');g.addColorStop(1,'#0c0b10');
  cx.fillStyle=g;cx.beginPath();cx.ellipse(sx,GROUND+3,42,10,0,0,Math.PI*2);cx.fill();
  cx.fillStyle='#141218';ell(cx,sx-36,GROUND+1,8,4);cx.fill();ell(cx,sx+40,GROUND+5,6,3);cx.fill();
  cx.strokeStyle='rgba(255,255,255,.22)';cx.lineWidth=1.5;const k=(G.t*.8+e.seed)%1;cx.beginPath();cx.ellipse(sx,GROUND+3,10+k*26,2.5+k*6,0,0,Math.PI*2);cx.globalAlpha*=1-k;cx.stroke();cx.globalAlpha=e.fling>0?cx.globalAlpha:1;
  cx.fillStyle='rgba(255,255,255,.35)';ell(cx,sx-14,GROUND,8,1.6);cx.fill();
 }else if(e.type==='log'){

  // 깊이 방향 몸통
  cx.fillStyle=lgrad(cx,0,cy-r,0,cy+r,[[0,'#8a5a32'],[.5,'#5e3a1e'],[1,'#3a2412']]);
  poly(cx,[sx,cy-r,sx+18,cy-r-10,sx+18,cy+r-10,sx,cy+r]);cx.fill();

  // 마구리(나이테)

  cx.fillStyle=sphere(cx,sx,cy,r-4,'#d7a86e');ell(cx,sx,cy,r-4,r-4);cx.fill();
  cx.strokeStyle='rgba(110,70,35,.6)';cx.lineWidth=1.5;for(const rr2 of[6,11,15]){ell(cx,sx,cy,rr2,rr2);cx.stroke()}
  cx.save();cx.translate(sx,cy);cx.rotate(e.rot);cx.strokeStyle='rgba(80,45,20,.7)';cx.lineWidth=2;cx.beginPath();cx.moveTo(-14,0);cx.lineTo(14,0);cx.moveTo(0,-14);cx.lineTo(0,6);cx.stroke();cx.restore();
  if(!(e.fling>0)&&G.state==='run'&&rand()<.3)G.parts.push({x:sx+r,y:GROUND+2,vx:40+rand()*60,vy:-40-rand()*60,r:2+rand()*2,life:.3,col:'rgba(150,120,80,.7)'});
 }else if(e.type==='spikes'){
  cx.fillStyle=sphere(cx,sx,GROUND,34,'#6e5638');ell(cx,sx,GROUND+1,36,9);cx.fill();

   cx.fillStyle=lgrad(cx,-5,0,5,0,[[0,'#456d32'],[.4,'#a6c97a'],[1,'#3c5f2b']]);
   poly(cx,[-5,0,-5,-h+12,5,-h,5,0]);cx.fill();
   cx.fillStyle='#e8f0c8';poly(cx,[-5,-h+12,5,-h,4,-h+6]);cx.fill();
   cx.fillStyle='#2f4a22';cx.fillRect(-5,-h*.45,10,2.5);

  const cy=GROUND-98+Math.sin(G.t*6+e.seed)*5,fl=Math.sin(G.t*18+e.seed);

  cx.fillStyle='#1d1a24';
  cx.beginPath();cx.moveTo(sx,cy);cx.quadraticCurveTo(sx+14,cy-26*fl,sx+34,cy-30*fl);cx.quadraticCurveTo(sx+20,cy-8*fl,sx+8,cy+4);cx.closePath();cx.fill();

  cx.fillStyle='#2c2836';ell(cx,sx-18,cy-5,9,8);cx.fill();
  poly(cx,[sx+18,cy-3,sx+32,cy-8,sx+30,cy+5]);cx.fill();
  cx.fillStyle='#e9b949';poly(cx,[sx-26,cy-6,sx-38,cy-3,sx-26,cy]);cx.fill();
  cx.fillStyle='#ffd84a';ell(cx,sx-20,cy-7,2.4,2.4);cx.fill();cx.fillStyle='#000';ell(cx,sx-20.5,cy-7,1.1,1.1);cx.fill();
  cx.fillStyle='#141218';cx.beginPath();cx.moveTo(sx-2,cy);cx.quadraticCurveTo(sx-16,cy+26*fl,sx-30,cy+28*fl);cx.quadraticCurveTo(sx-18,cy+8*fl,sx-6,cy+4);cx.closePath();cx.fill();
  if(G.state==='run'&&rand()<.15)G.parts.push({x:sx+20,y:cy,vx:30,vy:20,r:2+rand()*2,life:.5,col:'#141218'});
 }
 cx.restore();
 // 1장에서는 피하는 방법을 위에 적어 준다
 if(G.stage===0&&!e.used&&sx>PX&&sx<W-40){
  const air=O.air;cx.font='700 14px "Gowun Dodum",sans-serif';cx.textAlign='center';
  const t=air?'↓ 숙이기':'↑ 점프',ty=air?GROUND-140:GROUND-62;
  cx.lineWidth=4;cx.strokeStyle='rgba(20,18,26,.75)';cx.strokeText(t,sx,ty);cx.fillStyle='#fff';cx.fillText(t,sx,ty);

function drawBanner(){
 const b=G.banner;if(!b)return;
 const k=Math.max(0,Math.min(1,(b.d-b.t)/.35,b.t/.5));
 cx.save();cx.globalAlpha=k;cx.fillStyle='rgba(20,18,26,.82)';cx.beginPath();cx.moveTo(-10,180);
 for(let x=0;x<=W+10;x+=24)cx.lineTo(x,176+Math.sin(x*.07)*6);
 for(let x=W+10;x>=-10;x-=24)cx.lineTo(x,294+Math.sin(x*.05+1)*7);cx.closePath();cx.fill();
 cx.textAlign='center';cx.fillStyle='rgba(0,0,0,.5)';cx.font='66px "Nanum Brush Script",serif';cx.fillText(b.title,W/2+3,249);
 cx.fillStyle='#f6eedc';cx.fillText(b.title,W/2,246);
 cx.fillStyle='#e9b949';cx.font='19px "Gowun Dodum",sans-serif';cx.fillText(b.sub,W/2,278);cx.restore();
}
function drawPreviews(){
 for(const p of previews){
  const c=p.c,sel=p.id===G.char,C=CHARS[p.id];
  c.setTransform(1,0,0,1,0,0);
  c.fillStyle=lgrad(c,0,0,0,240,[[0,sel?'#f4dfb0':'#c9d6dc'],[1,sel?'#e9b97a':'#9fb1bb']]);c.fillRect(0,0,240,240);
  c.fillStyle=lgrad(c,0,190,0,240,[[0,'#b08a5c'],[1,'#7a5a3a']]);c.fillRect(0,192,240,48);
  c.fillStyle='rgba(255,255,255,.2)';c.fillRect(0,192,240,3);
  shadow(c,112,206,48,.35);
  c.save();c.translate(112,204);const s=1.4*C.scale;c.scale(s,s);
  drawHero(c,p.id,{phase:G.t*9,moving:sel,air:false,attack:0,hurt:false,slide:false,over:false,t:G.t});
  c.restore();
 }
}
function render(){
 cx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
 const S=STAGES[G.stage];
 cx.save();
 if(G.shake>0){const m=G.shake*16;cx.translate((rand()-.5)*m,(rand()-.5)*m)}
 drawBG(S);
 for(const e of G.ents)if(e.kind==='obs'&&!OBS[e.type].air)drawObs(e);
 for(const e of G.ents)if(e.kind==='item')drawItem(e);
 for(const e of G.ents)if(e.kind==='enemy')drawEnemy(e);
 drawPlayer();
 for(const e of G.ents)if(e.kind==='obs'&&OBS[e.type].air)drawObs(e);
 for(const p of G.parts){cx.globalAlpha=Math.max(0,Math.min(1,p.life*2));cx.fillStyle=p.col;ell(cx,p.x,p.y,p.r,p.r);cx.fill()}
 cx.globalAlpha=1;cx.textAlign='center';
 for(const f of G.floats){cx.globalAlpha=Math.min(1,f.life*1.5);cx.font=`700 ${f.size}px "Gowun Dodum",sans-serif`;cx.lineWidth=5;cx.strokeStyle='rgba(20,18,26,.85)';cx.strokeText(f.text,f.x,f.y);cx.fillStyle=f.col;cx.fillText(f.text,f.x,f.y)}
 cx.globalAlpha=1;cx.restore();
 if(G.flash>0){const g=cx.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.9);g.addColorStop(0,'rgba(224,60,40,0)');g.addColorStop(1,`rgba(224,40,30,${Math.min(.75,G.flash*1.4)})`);cx.fillStyle=g;cx.fillRect(0,0,W,H)}
 if(G.fade>0){cx.fillStyle=`rgba(243,234,214,${Math.min(1,G.fade)})`;cx.fillRect(0,0,W,H)}
 drawBanner();
 if(G.state==='title')drawPreviews();
}

/* ───────── 입력 ───────── */
panel.addEventListener('click',ev=>{
 const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
 const a=b.dataset.act;initAudio();
 if(a==='start'||a==='retry')start();else if(a==='opt')answer(+b.dataset.i);else if(a==='hint')useHint();
 else if(a==='next')next();else if(a==='home')toTitle();else if(a==='cat')toggleCat(b);else if(a==='char')pickChar(b);
});
addEventListener('keydown',ev=>{
 const k=ev.key,c=G.cur;
 if(G.state==='quiz'&&c){
  if(!c.done&&k>='1'&&k<='4'){const b=$('#opt'+(+k-1));if(b&&!b.disabled)answer(+k-1);ev.preventDefault();return}
  if(!c.done&&(k==='h'||k==='H'||k==='ㅗ')){useHint();return}
  if(c.done&&k==='Enter'){ev.preventDefault();next();return}
 }
 if(G.state==='run'){
  if(k===' '||k==='ArrowUp'||k==='w'||k==='W'||k==='ㅈ'){ev.preventDefault();if(!ev.repeat)jump()}
  else if(k==='ArrowDown'||k==='s'||k==='S'||k==='ㄴ'){ev.preventDefault();slide()}
 }
});
cv.addEventListener('pointerdown',()=>{initAudio();jump()});
$('#jumpBtn').addEventListener('pointerdown',ev=>{ev.preventDefault();initAudio();jump()});
$('#slideBtn').addEventListener('pointerdown',ev=>{ev.preventDefault();initAudio();slide()});
$('#mute').addEventListener('click',ev=>{muted=!muted;ev.currentTarget.setAttribute('aria-pressed',muted);ev.currentTarget.setAttribute('aria-label',muted?'소리 켜기':'소리 끄기')});

if(document.fonts&&document.fonts.load){['21px "Noto Serif KR"','66px "Nanum Brush Script"','15px "Gowun Dodum"'].forEach(f=>document.fonts.load(f,'藥蔘符筆 한문 원정기').catch(()=>{}))}
G.hp=G.maxHp=CH().hp;
showTitle();
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
